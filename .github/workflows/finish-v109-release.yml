name: Finish v1.0.9 release

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/finish-v109-release.yml

permissions:
  actions: write
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - name: Cancel obsolete queued runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 30333603964 || true
          gh run cancel 30333471974 || true

      - name: Dispatch Intel build on supported runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh run list --workflow package-macos.yml --event workflow_dispatch --branch now --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run package-macos.yml --ref now -f tag_name=v1.0.9 -f arch=x86_64

          run_id=0
          for _ in $(seq 1 60); do
            sleep 5
            run_id="$(gh run list --workflow package-macos.yml --event workflow_dispatch --branch now --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$run_id" != "0" ] && [ "$run_id" != "$before" ]; then
              break
            fi
          done

          if [ "$run_id" = "0" ] || [ "$run_id" = "$before" ]; then
            echo "未找到新的 Intel macOS 构建任务"
            exit 1
          fi

          echo "Watching Intel macOS run $run_id"
          gh run watch "$run_id" --exit-status

      - name: Record final release status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.9" > /tmp/release.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          runs_payload = json.loads(Path('/tmp/runs.json').read_text(encoding='utf-8'))
          names = {'Release v1.0.9 once', 'Finish v1.0.9 release', 'Package Windows x64', 'Package macOS', 'Quality and API compatibility'}
          runs = []
          for run in runs_payload.get('workflow_runs', []):
              if run.get('name') in names:
                  runs.append({key: run.get(key) for key in ('id','name','event','status','conclusion','head_branch','head_sha','created_at','updated_at','html_url')})
          output = {
              'release': {key: release.get(key) for key in ('id','tag_name','name','draft','prerelease','published_at','html_url','target_commitish')},
              'assets': [{key: asset.get(key) for key in ('id','name','size','state','download_count','created_at','updated_at','browser_download_url')} for asset in release.get('assets', [])],
              'runs': runs,
          }
          Path('/tmp/v1.0.9-release-status.json').write_text(json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

          git checkout --orphan diagnostic-v109-release-final
          git rm -rf .
          cp /tmp/v1.0.9-release-status.json .
          git add v1.0.9-release-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record final v1.0.9 release status"
          git push --force origin HEAD:diagnostic/v1.0.9-release

      - name: Remove temporary release workflows
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin now
          git checkout -B now origin/now
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/release-v1.0.9-once.yml \
            .github/workflows/inspect-v109-release.yml \
            .github/workflows/finish-v109-release.yml
          git commit -m "chore: clean up v1.0.9 release workflows"
          git push origin now
