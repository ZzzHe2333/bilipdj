name: One-time confirmed bug repair

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/repair-confirmed-bugs.yml

permissions:
  contents: write

concurrency:
  group: one-time-confirmed-bug-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply confirmed fixes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one regex match, found {count}")
              return updated

          server_path = Path("core/server.py")
          server = server_path.read_text(encoding="utf-8")

          server = replace_once(server, "import hashlib\n", "import hashlib\nimport io\n", "add io import")
          server = replace_once(server, "import threading\n", "import threading\nfrom functools import wraps\n", "add wraps import")
          server = replace_once(server, 'DEFAULT_HOST = "0.0.0.0"', 'DEFAULT_HOST = "127.0.0.1"', "localhost default")

          server = replace_once(
              server,
              'WS_MAGIC_GUID = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"\n\n\nSTYLE_CSS_VAR_MAP',
              '''WS_MAGIC_GUID = "258EAFA5-E914-47DA-95CA-C5AB0DC85B11"
          MAX_WS_FRAME_BYTES = 1024 * 1024
          _CONFIG_IO_LOCK = threading.RLock()


          def _serialized_config_io(func):
              @wraps(func)
              def wrapped(*args, **kwargs):
                  with _CONFIG_IO_LOCK:
                      return func(*args, **kwargs)
              return wrapped


          STYLE_CSS_VAR_MAP''',
              "shared locks and websocket limit",
          )

          server = replace_once(
              server,
              '''        self._clients: set[socket.socket] = set()
                  self._lock = threading.Lock()
                  self.last_message_at: str = ""''',
              '''        self._clients: set[socket.socket] = set()
                  self._client_locks: dict[socket.socket, threading.Lock] = {}
                  self._lock = threading.Lock()
                  self.last_message_at: str = ""''',
              "websocket client locks init",
          )
          server = replace_once(
              server,
              '''    def register(self, conn: socket.socket) -> None:
                  with self._lock:
                      self._clients.add(conn)
                      count = len(self._clients)
                  self.logger.info("WebSocket 客户端已连接，当前 %s 个", count)

              def unregister(self, conn: socket.socket) -> None:
                  with self._lock:
                      self._clients.discard(conn)
                      count = len(self._clients)
                  self.logger.info("WebSocket 客户端已断开，当前 %s 个", count)''',
              '''    def register(self, conn: socket.socket) -> None:
                  with self._lock:
                      self._clients.add(conn)
                      self._client_locks.setdefault(conn, threading.Lock())
                      count = len(self._clients)
                  self.logger.info("WebSocket 客户端已连接，当前 %s 个", count)

              def unregister(self, conn: socket.socket) -> None:
                  with self._lock:
                      self._clients.discard(conn)
                      self._client_locks.pop(conn, None)
                      count = len(self._clients)
                  self.logger.info("WebSocket 客户端已断开，当前 %s 个", count)''',
              "websocket register locks",
          )
          server = replace_once(
              server,
              '''    def broadcast_text(self, sender: socket.socket | None, text: str) -> None:
                  dead: list[socket.socket] = []
                  with self._lock:
                      targets = list(self._clients)

                  for conn in targets:
                      if sender is not None and conn is sender:
                          continue
                      try:
                          _ws_send_text(conn, text)
                      except OSError:
                          dead.append(conn)

                  if dead:
                      with self._lock:
                          for conn in dead:
                              self._clients.discard(conn)

              def mark_message(self) -> None:''',
              '''    def send_text(self, conn: socket.socket, text: str, opcode: int = 0x1) -> None:
                  with self._lock:
                      write_lock = self._client_locks.get(conn)
                  if write_lock is None:
                      write_lock = threading.Lock()
                  with write_lock:
                      _ws_send_text(conn, text, opcode=opcode)

              def broadcast_text(self, sender: socket.socket | None, text: str) -> None:
                  dead: list[socket.socket] = []
                  with self._lock:
                      targets = list(self._clients)

                  for conn in targets:
                      if sender is not None and conn is sender:
                          continue
                      try:
                          self.send_text(conn, text)
                      except OSError:
                          dead.append(conn)

                  if dead:
                      with self._lock:
                          for conn in dead:
                              self._clients.discard(conn)
                              self._client_locks.pop(conn, None)

              def mark_message(self) -> None:''',
              "websocket serialized writes",
          )
          server = replace_once(
              server,
              '''def _ws_send_text(conn: socket.socket, text: str, opcode: int = 0x1) -> None:''',
              '''def _ws_recv_exact(conn: socket.socket, size: int) -> bytes | None:
              chunks = bytearray()
              while len(chunks) < size:
                  chunk = conn.recv(size - len(chunks))
                  if not chunk:
                      return None
                  chunks.extend(chunk)
              return bytes(chunks)


          def _ws_send_text(conn: socket.socket, text: str, opcode: int = 0x1) -> None:''',
              "websocket exact reader helper",
          )

          server = replace_once(
              server,
              '''def _read_raw_config() -> dict[str, Any]:
              if not CONFIG_PATH.exists():
                  return {}
              return load_simple_yaml(CONFIG_PATH)''',
              '''def _atomic_write_text(path: Path, content: str, *, encoding: str = "utf-8") -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              temp_path = path.with_name(
                  f".{path.name}.{os.getpid()}.{threading.get_ident()}.tmp"
              )
              with _CONFIG_IO_LOCK:
                  try:
                      temp_path.write_text(content, encoding=encoding)
                      os.replace(temp_path, path)
                  finally:
                      temp_path.unlink(missing_ok=True)


          @_serialized_config_io
          def _read_raw_config() -> dict[str, Any]:
              if not CONFIG_PATH.exists():
                  return {}
              return load_simple_yaml(CONFIG_PATH)''',
              "atomic config helper",
          )

          server = regex_once(
              server,
              r'''def write_queue_archive_entries\(path: Path, entries: list\[dict\[str, Any\]\], meta: dict\[str, Any\] \| None = None\) -> None:\n.*?\n\ndef blacklist_names_to_entries''',
              '''def write_queue_archive_entries(path: Path, entries: list[dict[str, Any]], meta: dict[str, Any] | None = None) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              metadata = meta if isinstance(meta, dict) else {}
              timestamp = _format_archive_timestamp(metadata.get("timestamp"))
              buffer = io.StringIO(newline="")
              writer = csv.writer(buffer)
              writer.writerow([ARCHIVE_META_TIMESTAMP, timestamp])
              writer.writerow([ARCHIVE_META_ACTOR, str(metadata.get("actor", "") or "")])
              writer.writerow([ARCHIVE_META_MESSAGE, str(metadata.get("message", "") or "")])
              writer.writerow([])
              writer.writerow([ARCHIVE_HEADER_SEQ, ARCHIVE_HEADER_ID, ARCHIVE_HEADER_CONTENT, ARCHIVE_HEADER_LAST_OPERATION_AT])
              for idx, entry in enumerate(entries, start=1):
                  normalized = queue_item_to_entry(entry)
                  writer.writerow(
                      [
                          idx,
                          normalized.get("id", ""),
                          normalized.get("content", ""),
                          normalized.get("last_operation_at", ""),
                      ]
                  )
              _atomic_write_text(path, buffer.getvalue(), encoding="utf-8-sig")


          def blacklist_names_to_entries''',
              "queue archive metadata and atomic writes",
          )

          server = replace_once(
              server,
              '''def save_config(config: dict[str, Any], *, preserve_legacy_api_schema: bool | None = None) -> None:''',
              '''@_serialized_config_io
          def save_config(config: dict[str, Any], *, preserve_legacy_api_schema: bool | None = None) -> None:''',
              "serialize config saves",
          )
          server = replace_once(
              server,
              '''    CONFIG_PATH.write_text(content, encoding="utf-8")''',
              '''    _atomic_write_text(CONFIG_PATH, content, encoding="utf-8")''',
              "atomic config save",
          )
          server = replace_once(
              server,
              '''def save_platform_config_slot(slot: int, data: dict[str, Any]) -> dict[str, Any]:
              normalized = _default_platform_slot_payload(data)
              PD_DIR.mkdir(parents=True, exist_ok=True)
              path = platform_config_path(slot)
              path.write_text(_render_platform_slot_yaml(normalized), encoding="utf-8")
              return normalized''',
              '''@_serialized_config_io
          def save_platform_config_slot(slot: int, data: dict[str, Any]) -> dict[str, Any]:
              normalized = _default_platform_slot_payload(data)
              PD_DIR.mkdir(parents=True, exist_ok=True)
              path = platform_config_path(slot)
              _atomic_write_text(path, _render_platform_slot_yaml(normalized), encoding="utf-8")
              return normalized''',
              "atomic platform slot save",
          )

          server = replace_once(
              server,
              '''        for slot, slot_file in enumerate(archive_paths, start=1):
                      write_queue_archive_entries(slot_file, _build_seed_archive_entries(slot))''',
              '''        for slot, slot_file in enumerate(archive_paths, start=1):
                      write_queue_archive_entries(slot_file, [])''',
              "empty initial queue archives",
          )

          server = regex_once(
              server,
              r'''(class QueueArchiveManager:.*?self\._lock = )threading\.Lock\(\)''',
              r'''\1threading.RLock()''',
              "queue archive reentrant lock",
          )
          server = replace_once(
              server,
              '''    def _write_state(self, state: dict[str, int]) -> None:
                  QUEUE_STATE_PATH.write_text(
                      json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8"
                  )''',
              '''    def _write_state(self, state: dict[str, int]) -> None:
                  _atomic_write_text(
                      QUEUE_STATE_PATH,
                      json.dumps(state, ensure_ascii=False, indent=2),
                      encoding="utf-8",
                  )''',
              "atomic queue state",
          )
          server = regex_once(
              server,
              r'''    def write_snapshot\(self, actor: str, message: str, queue_items: list\[Any\]\) -> Path \| None:\n.*?\n    def write_blank_snapshot''',
              '''    def write_snapshot(self, actor: str, message: str, queue_items: list[Any]) -> Path | None:
                  if not self.enabled:
                      return None

                  with self._lock:
                      state = self._read_state()
                      slot = max(1, min(self.slots, int(state.get("active_slot", 1))))
                      out = self._slot_file(slot)
                      default_timestamp = _format_archive_timestamp()
                      entries = [
                          build_queue_entry(
                              entry.get("id", ""),
                              entry.get("content", ""),
                              entry.get("last_operation_at", "") or default_timestamp,
                          )
                          for entry in queue_items_to_entries(queue_items)
                      ]
                      write_queue_archive_entries(
                          out,
                          entries,
                          meta={
                              "timestamp": default_timestamp,
                              "actor": actor,
                              "message": message,
                          },
                      )
                      return out

              def write_blank_snapshot''',
              "serialized queue snapshots",
          )
          server = regex_once(
              server,
              r'''    def write_blank_snapshot\(self, actor: str, message: str\) -> Path \| None:\n.*?\n    def _read_snapshot''',
              '''    def write_blank_snapshot(self, actor: str, message: str) -> Path | None:
                  if not self.enabled:
                      return None
                  with self._lock:
                      state = self._read_state()
                      slot = max(1, min(self.slots, int(state.get("active_slot", 1))))
                      out = self._slot_file(slot)
                      timestamp = _format_archive_timestamp()
                      write_queue_archive_entries(
                          out,
                          [],
                          meta={
                              "timestamp": timestamp,
                              "actor": actor,
                              "message": message,
                          },
                      )
                      return out

              def _read_snapshot''',
              "serialized blank snapshots",
          )

          server = replace_once(
              server,
              '''    def _find_index(self, uname: str) -> int:
                  for i, item in enumerate(self._persons):
                      if uname in item:
                          return i
                  return -1''',
              '''    def _find_index(self, uname: str) -> int:
                  target = str(uname or "").strip()
                  if not target:
                      return -1
                  for i, item in enumerate(self._persons):
                      item_id, _content = queue_item_to_parts(item)
                      if item_id == target:
                          return i
                  return -1''',
              "exact queue identity matching",
          )
          server = replace_once(
              server,
              '''                    self._persist_myjs_state_unlocked()
                      modified = bool(selected)

                  join_master_enabled = kg.get("paidui", True)''',
              '''                    self._persist_myjs_state_unlocked()
                      modified = bool(selected)

                  if self._gift_queue_only and not modified and self._is_join_cmd(msg) and not has_op:
                      return False, "当前仅允许使用礼物资格排队"

                  join_master_enabled = kg.get("paidui", True)''',
              "gift-only enforcement",
          )
          server = replace_once(
              server,
              '''            if has_op:
                      for kw in ("del", "删除", "完成"):''',
              '''            if has_op:
                      if msg == "完成" and self._persons:
                          self._remove_queue_item_unlocked(0)
                          modified = True

                      for kw in ("del", "删除", "完成"):''',
              "complete removes queue head",
          )

          for method in (
              "_persist_myjs_state_unlocked",
              "_persist_quanxian_state_unlocked",
              "_persist_kaiguan_state_unlocked",
          ):
              server = replace_once(
                  server,
                  f"    def {method}(self) -> None:",
                  f"    @_serialized_config_io\n    def {method}(self) -> None:",
                  f"serialize {method}",
              )

          server = replace_once(
              server,
              '''class ApiHandler(BaseHTTPRequestHandler):
              server_version = "DanmujiBackend/0.3"

              def log_message''',
              '''class ApiHandler(BaseHTTPRequestHandler):
              server_version = "DanmujiBackend/0.3"
              _LOCAL_ONLY_GET_PATHS = {
                  "/model",
                  "/api/config/basic",
                  "/api/config/login",
                  "/api/config",
                  "/api/quanxian",
                  "/api/kaiguan",
                  "/api/style",
                  "/api/blacklist/state",
                  "/api/bili/qr/start",
              }

              def _is_loopback_client(self) -> bool:
                  host = str(self.client_address[0] if self.client_address else "").strip().lower()
                  return host in {"127.0.0.1", "::1", "localhost"} or host.startswith("::ffff:127.")

              def _require_loopback(self) -> bool:
                  if self._is_loopback_client():
                      return True
                  self._write_json(
                      {"status": "error", "message": "Management API is local-only"},
                      status=HTTPStatus.FORBIDDEN,
                  )
                  return False

              def log_message''',
              "local-only management helper",
          )

          server = regex_once(
              server,
              r'''    def _build_basic_config_payload\(self\) -> dict\[str, Any\]:\n.*?\n    def _build_login_config_payload''',
              '''    def _build_basic_config_payload(self, *, include_secrets: bool = False) -> dict[str, Any]:
                  cfg = self.server.runtime_config
                  platform_payload = _build_platform_config_payload(cfg)
                  bilibili_cfg = dict(platform_payload["bilibili"])
                  douyin_cfg = copy.deepcopy(platform_payload["douyin"])
                  if not include_secrets:
                      bilibili_cfg.pop("cookie", None)
                      douyin_cfg.pop("cookie", None)
                      douyin_cfg.pop("signature", None)
                  platform_archive = _get_platform_config_archive(cfg)
                  payload = {
                      "roomid": int(bilibili_cfg.get("roomid", 0)),
                      "uid": int(bilibili_cfg.get("uid", 0)),
                      "bilibili": bilibili_cfg,
                      "platform": platform_payload["platform"],
                      "douyin": douyin_cfg,
                      "platform_config_archive": {
                          "slots": MAX_QUEUE_ARCHIVE_SLOTS,
                          "active_slot": int(platform_archive.get("active_slot", 1)),
                      },
                  }
                  for platform_key in RESERVED_RUNTIME_PLATFORMS:
                      reserved = copy.deepcopy(
                          platform_payload.get(platform_key, RESERVED_PLATFORM_SECTION_DEFAULT)
                      )
                      if not include_secrets:
                          reserved.pop("cookie", None)
                          reserved.pop("auth_token", None)
                      payload[platform_key] = reserved
                  return payload

              def _build_login_config_payload''',
              "redact basic config payload",
          )
          server = replace_once(
              server,
              '''        payload = self._build_basic_config_payload()
                  payload["cookie"]''',
              '''        payload = self._build_basic_config_payload(include_secrets=True)
                  payload["cookie"]''',
              "login config includes secrets locally",
          )
          server = replace_once(
              server,
              '''    def do_GET(self) -> None:  # noqa: N802
                  parsed = urlparse(self.path)
                  if parsed.path in {"/ws", "/danmu/sub"}:''',
              '''    def do_GET(self) -> None:  # noqa: N802
                  parsed = urlparse(self.path)
                  if parsed.path in self._LOCAL_ONLY_GET_PATHS and not self._require_loopback():
                      return
                  if parsed.path in {"/ws", "/danmu/sub"}:''',
              "protect management GETs",
          )
          server = replace_once(
              server,
              '''        if parsed.path == "/api/config":
                      cfg = self.server.runtime_config
                      platform_payload = self._build_basic_config_payload()''',
              '''        if parsed.path == "/api/config":
                      cfg = self.server.runtime_config
                      platform_payload = self._build_basic_config_payload(include_secrets=True)''',
              "full config local secrets",
          )
          server = replace_once(
              server,
              '''    def do_POST(self) -> None:  # noqa: N802
                  parsed = urlparse(self.path)''',
              '''    @_serialized_config_io
              def do_POST(self) -> None:  # noqa: N802
                  parsed = urlparse(self.path)
                  if not self._require_loopback():
                      return''',
              "protect and serialize POSTs",
          )

          server = regex_once(
              server,
              r'''    def _ws_recv_text\(self, conn: socket\.socket\) -> str \| None:\n.*?\n    def _ws_send_text\(self, conn: socket\.socket, text: str\) -> None:\n        _ws_send_text\(conn, text\)''',
              '''    def _ws_recv_text(self, conn: socket.socket) -> str | None:
                  try:
                      head = _ws_recv_exact(conn, 2)
                      if head is None:
                          return None

                      b1, b2 = head
                      opcode = b1 & 0x0F
                      masked = (b2 >> 7) & 1
                      payload_len = b2 & 0x7F

                      if opcode == 0x8:
                          return None
                      if not masked:
                          return None
                      if opcode == 0x9:  # ping
                          mask_key = _ws_recv_exact(conn, 4)
                          if mask_key is None:
                              return None
                          self.server.ws_hub.send_text(conn, "", opcode=0xA)
                          return ""
                      if opcode != 0x1:
                          return ""

                      if payload_len == 126:
                          raw_length = _ws_recv_exact(conn, 2)
                          if raw_length is None:
                              return None
                          payload_len = struct.unpack("!H", raw_length)[0]
                      elif payload_len == 127:
                          raw_length = _ws_recv_exact(conn, 8)
                          if raw_length is None:
                              return None
                          payload_len = struct.unpack("!Q", raw_length)[0]

                      if payload_len > MAX_WS_FRAME_BYTES:
                          return None
                      mask_key = _ws_recv_exact(conn, 4)
                      if mask_key is None:
                          return None
                      payload = _ws_recv_exact(conn, payload_len)
                      if payload is None:
                          return None
                      payload = bytes(b ^ mask_key[i % 4] for i, b in enumerate(payload))
                      return payload.decode("utf-8", errors="replace")
                  except (ConnectionError, OSError, TimeoutError, struct.error):
                      return None

              def _ws_send_text(self, conn: socket.socket, text: str) -> None:
                  self.server.ws_hub.send_text(conn, text)''',
              "robust websocket frame reads",
          )

          server_path.write_text(server, encoding="utf-8")

          panel_path = Path("core/control_panel.py")
          panel = panel_path.read_text(encoding="utf-8")
          panel = replace_once(
              panel,
              '''    def save_to_file(self) -> None:''',
              '''    def save_to_file(self) -> bool:''',
              "save_to_file return type",
          )
          panel = replace_once(
              panel,
              '''        except ValueError as exc:
                      messagebox.showerror("输入错误", str(exc))
                  except OSError as exc:
                      messagebox.showerror("保存失败", str(exc))
                      return
                  except Exception as exc:  # noqa: BLE001
                      messagebox.showerror("保存失败", str(exc))
                      return''',
              '''        except ValueError as exc:
                      messagebox.showerror("输入错误", str(exc))
                      return False
                  except OSError as exc:
                      messagebox.showerror("保存失败", str(exc))
                      return False
                  except Exception as exc:  # noqa: BLE001
                      messagebox.showerror("保存失败", str(exc))
                      return False''',
              "save failure returns false",
          )
          panel = replace_once(
              panel,
              '''        if self._overlay_process_running():
                      self._restart_overlay_process()
                  self._switch_queue_slot()

              def _read_slot_csv''',
              '''        if self._overlay_process_running():
                      self._restart_overlay_process()
                  self._switch_queue_slot()
                  return True

              def _read_slot_csv''',
              "save success returns true",
          )
          panel = replace_once(
              panel,
              '''        try:
                      self.save_to_file()
                      if getattr(sys, "frozen", False):''',
              '''        try:
                      if not self.save_to_file():
                          return
                      if getattr(sys, "frozen", False):''',
              "abort backend start after failed save",
          )
          panel_path.write_text(panel, encoding="utf-8")

          requirements = '''\
          brotli>=1.1,<2
          Pillow>=10,<13
          protobuf>=4.25,<7
          psutil>=5.9,<8
          qrcode[pil]>=7.4,<9
          '''
          Path("requirements.txt").write_text(textwrap.dedent(requirements), encoding="utf-8")

          win_path = Path("package-windows-local.ps1")
          win = win_path.read_text(encoding="utf-8")
          win = replace_once(
              win,
              "& $PythonExe -m pip install pyinstaller 'qrcode[pil]' brotli psutil",
              "& $PythonExe -m pip install pyinstaller",
              "windows requirements source of truth",
          )
          win_path.write_text(win, encoding="utf-8")

          mac_path = Path("package-macos-local.sh")
          mac = mac_path.read_text(encoding="utf-8")
          mac = replace_once(
              mac,
              "python3 -m pip install pyinstaller 'qrcode[pil]' brotli psutil",
              "python3 -m pip install pyinstaller",
              "mac requirements source of truth",
          )
          mac_path.write_text(mac, encoding="utf-8")

          for spec_name in ("bilipdj_onedir.spec", "bilipdj_onedir_mac.spec"):
              spec_path = Path(spec_name)
              spec = spec_path.read_text(encoding="utf-8")
              spec = replace_once(
                  spec,
                  '''    "brotli",
              "psutil",''',
                  '''    "brotli",
              "psutil",
              "google.protobuf",
              "google.protobuf.internal.builder",''',
                  f"protobuf hidden imports in {spec_name}",
              )
              spec_path.write_text(spec, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "后端默认端口为 `9816`，默认监听地址为 `0.0.0.0`。仅本机使用时，建议在设置中改为 `127.0.0.1`，不要直接暴露到公网。",
              "后端默认监听 `127.0.0.1:9816`。管理接口仅接受本机请求；如手动修改监听地址，也不要把服务直接暴露到公网。",
          )
          readme_path.write_text(readme, encoding="utf-8")

          tests_dir = Path("tests")
          tests_dir.mkdir(exist_ok=True)
          test_content = r'''
          from __future__ import annotations

          import csv
          import logging
          import socket
          import tempfile
          import unittest
          from pathlib import Path

          from core import server


          class DummyHub:
              def broadcast_json(self, *_args, **_kwargs):
                  return None


          class DummyArchive:
              def write_snapshot(self, *_args, **_kwargs):
                  return None

              def get_active_slot(self):
                  return 1

              def read_snapshot_by_slot(self, _slot):
                  return {"entries": []}


          def manager() -> server.QueueManager:
              qm = server.QueueManager(DummyHub(), DummyArchive(), logging.getLogger("test"))
              qm.load_kaiguan(dict(server.DEFAULT_KAIGUAN))
              return qm


          class QueueRegressionTests(unittest.TestCase):
              def test_name_matching_is_exact(self):
                  qm = manager()
                  qm._persons = ["雪梦茉莉 原神"]
                  self.assertEqual(qm._find_index("雪梦茉莉"), 0)
                  self.assertEqual(qm._find_index("茉莉"), -1)

              def test_gift_only_rejects_normal_queue(self):
                  qm = manager()
                  qm.load_config({"gift_queue_only": True})
                  changed, note = qm._process(1, "普通用户", "排队", False, False, False, 0)
                  self.assertFalse(changed)
                  self.assertIn("礼物资格", note or "")
                  self.assertEqual(qm.get_queue(), [])

              def test_complete_removes_first_item(self):
                  qm = manager()
                  qm._persons = ["甲", "乙"]
                  qm._entry_timestamps = ["", ""]
                  changed, _note = qm._process(99, "主播", "完成", True, False, False, 0)
                  self.assertTrue(changed)
                  self.assertEqual(qm.get_queue(), ["乙"])

              def test_archive_metadata_round_trip(self):
                  with tempfile.TemporaryDirectory() as tmp:
                      path = Path(tmp) / "slot.csv"
                      server.write_queue_archive_entries(
                          path,
                          [server.build_queue_entry("甲", "任务", "2026-07-18 09:00:00")],
                          meta={
                              "timestamp": "2026-07-18 09:01:00",
                              "actor": "管理员",
                              "message": "完成",
                          },
                      )
                      with path.open("r", encoding="utf-8-sig", newline="") as handle:
                          meta, entries = server.parse_queue_archive_rows(list(csv.reader(handle)))
                      self.assertEqual(meta["actor"], "管理员")
                      self.assertEqual(meta["message"], "完成")
                      self.assertEqual(entries[0]["id"], "甲")

              def test_default_bind_is_loopback(self):
                  self.assertEqual(server.DEFAULT_HOST, "127.0.0.1")

              def test_exact_socket_read_handles_fragmentation(self):
                  left, right = socket.socketpair()
                  try:
                      right.sendall(b"a")
                      right.sendall(b"bc")
                      self.assertEqual(server._ws_recv_exact(left, 3), b"abc")
                  finally:
                      left.close()
                      right.close()


          if __name__ == "__main__":
              unittest.main()
          '''
          (tests_dir / "test_regressions.py").write_text(
              textwrap.dedent(test_content).lstrip(), encoding="utf-8"
          )
          PY

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax and regression tests
        run: |
          python -m compileall -q core tests
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit repaired code and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-confirmed-bugs.yml
          git add core/server.py core/control_panel.py requirements.txt package-windows-local.ps1 package-macos-local.sh bilipdj_onedir.spec bilipdj_onedir_mac.spec README.md tests/test_regressions.py
          git commit -m "fix: harden local API and repair queue regressions"
          git push origin HEAD:now
