name: Capture backend startup animation v10 commit error

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/inspect-backend-startup-animation-v9.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0
      - name: Save v10 job log tail on diagnostic branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/jobs/88059142451/logs" > /tmp/v10-job.log
          tail -n 100 /tmp/v10-job.log > /tmp/backend-startup-animation-v10-error.log
          git checkout --orphan diagnostic-workflow-status
          git rm -rf .
          cp /tmp/backend-startup-animation-v10-error.log .
          git add backend-startup-animation-v10-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record startup animation v10 commit error"
          git push --force origin HEAD:diagnostic/workflow-status
