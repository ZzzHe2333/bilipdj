name: Structural repair fixed run

on:
  pull_request:
    branches: [now]
    paths:
      - .github/workflows/v2-run-fixed.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply corrected structural script
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee fixed-run.log
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/finalize-repair-v2.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python - <<'PY'\n(.*?)^          PY$", workflow)
          if match is None:
              raise RuntimeError('Unable to extract v2 script')
          script = textwrap.dedent(match.group(1))
          script, count = re.subn(
              r'lock_file\.write\(b"(?:\\\\|\\)?0"\)',
              'lock_file.write(bytes([0]))',
              script,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'null-byte patch count={count}')
          exec(compile(script, 'finalize_v2_fixed.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate corrected structural repair
        shell: bash
        run: |
          set -o pipefail
          {
            python -m compileall -q core test_finalize_repair.py
            python -m unittest -v test_finalize_repair.py
            git diff --check
          } 2>&1 | tee -a fixed-run.log

      - name: Commit corrected structural repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f test_finalize_repair.py fixed-run.log
          git rm -f .github/workflows/finalize-confirmed-repair.yml
          git rm -f .github/workflows/finalize-diagnostic.yml
          git rm -f .github/workflows/finalize-repair-v2.yml
          git rm -f .github/workflows/v2-diagnostic.yml
          git rm -f .github/workflows/v2-run-fixed.yml
          git rm -f finalize.log v2-validation.log || true
          git add core/server.py core/control_panel.py
          git commit -m "fix: finalize websocket framing and config transactions"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Preserve corrected-run log
        if: failure()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test -f fixed-run.log || echo "Corrected run failed before log creation" > fixed-run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f fixed-run.log
          git commit -m "chore: preserve corrected repair log" || exit 0
          git push origin "HEAD:${HEAD_BRANCH}"
