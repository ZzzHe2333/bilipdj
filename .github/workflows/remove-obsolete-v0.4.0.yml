name: Remove obsolete v0.4.0 release

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/remove-obsolete-v0.4.0.yml

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - name: Delete obsolete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release delete v0.4.0 --cleanup-tag --yes
          else
            git push origin :refs/tags/v0.4.0 || true
          fi

          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 release still exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 tag still exists"
            exit 1
          fi

      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-obsolete-v0.4.0.yml
          git commit -m "chore: remove obsolete v0.4.0 cleanup workflow"
          git push origin HEAD:now
