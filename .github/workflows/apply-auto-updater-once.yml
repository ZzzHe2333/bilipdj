name: Apply auto-updater integration once

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/apply-auto-updater-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-updater
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate and validate
        run: |
          python scripts/integrate_update_ui.txt
          rm scripts/integrate_update_ui.txt
          python -m pip install -r requirements.txt
          python -m compileall -q core tests
          python -m unittest discover -s tests -v
          python scripts/scan_secrets.py
          git diff --check
          grep -q 'from core import update_ui' core/control_panel.py
          grep -q 'update_ui.build_about_tab' core/control_panel.py
          grep -q 'update_ui.auto_check' core/control_panel.py
      - name: Commit feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/control_panel.py
          git add -u scripts/integrate_update_ui.txt
          git commit -m "feat: integrate automatic updater UI"
          git push origin HEAD:feature/auto-updater

# Trigger after workflow registration.
