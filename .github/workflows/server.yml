name: Validate Server

on:
  workflow_dispatch:
  push:
    branches: [now]
    paths: ['apps/server/**', 'apps/web/**', 'core/**', 'docker-compose.yml', '.dockerignore', 'docs/DOCKER.md', '.github/ci/redtv_issue121_guard.py', '.github/ci/issue123_regression_guard.py', '.github/ci/issue126_security_guard.py', '.github/ci/issue128_plugin_architecture_guard.py', '.github/ci/issue130_plugin_manager_guard.py', '.github/ci/issue130_plugin_hardening_guard.py', '.github/ci/issue130_js_runtime_probe.py', '.github/ci/issue132_plugin_api_security_guard.py', '.github/ci/issue134_plugin_mutation_guard.py', 'requirements.txt']
  pull_request:
    paths: ['apps/server/**', 'apps/web/**', 'core/**', 'docker-compose.yml', '.dockerignore', 'docs/DOCKER.md', '.github/ci/redtv_issue121_guard.py', '.github/ci/issue123_regression_guard.py', '.github/ci/issue126_security_guard.py', '.github/ci/issue128_plugin_architecture_guard.py', '.github/ci/issue130_plugin_manager_guard.py', '.github/ci/issue130_plugin_hardening_guard.py', '.github/ci/issue130_js_runtime_probe.py', '.github/ci/issue132_plugin_api_security_guard.py', '.github/ci/issue134_plugin_mutation_guard.py', 'requirements.txt']

jobs:
  validate-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q apps/server core .github/ci/redtv_issue121_guard.py .github/ci/issue123_regression_guard.py .github/ci/issue126_security_guard.py .github/ci/issue128_plugin_architecture_guard.py .github/ci/issue130_plugin_manager_guard.py .github/ci/issue130_plugin_hardening_guard.py .github/ci/issue130_js_runtime_probe.py .github/ci/issue132_plugin_api_security_guard.py .github/ci/issue134_plugin_mutation_guard.py
      - name: Red TV issue 121 regression guard
        run: python .github/ci/redtv_issue121_guard.py
      - name: Issue 123 regression guard
        run: python .github/ci/issue123_regression_guard.py
      - name: Issue 126 security regression guard
        run: python .github/ci/issue126_security_guard.py
      - name: Issue 128 plugin architecture guard
        run: python .github/ci/issue128_plugin_architecture_guard.py
      - name: Issue 130 QuickJS runtime probe
        run: python .github/ci/issue130_js_runtime_probe.py
      - name: Issue 130 plugin manager regression guard
        run: python .github/ci/issue130_plugin_manager_guard.py
      - name: Issue 130 plugin hardening guard
        run: python .github/ci/issue130_plugin_hardening_guard.py
      - name: Issue 132 plugin API security guard
        run: python .github/ci/issue132_plugin_api_security_guard.py
      - name: Issue 134 plugin mutation guard
        run: python .github/ci/issue134_plugin_mutation_guard.py
      - name: Validate migrated backend entry point
        run: |
          python - <<'PY'
          import importlib
          from apps.server.main import configure_web_assets
          backend = importlib.import_module('apps.server.server')
          legacy = importlib.import_module('core.server')
          assert backend is legacy
          assert 'apps/server/server.py' in backend.__file__.replace('\\', '/')
          path = configure_web_assets()
          assert (path / 'index.html').is_file()
          print(backend.__file__)
          print(path)
          PY

  docker-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Seed ignored build-context sentinels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data core/cd apps/server/__pycache__
          printf 'context-leak-sentinel\n' > data/context-leak-sentinel.txt
          printf 'context-leak-sentinel: true\n' > core/config.yaml
          printf 'context-leak-sentinel\n' > core/cd/context-leak-sentinel.txt
          printf 'context-leak-sentinel\n' > apps/server/__pycache__/context-leak-sentinel.pyc
          printf 'CONTEXT_LEAK_SENTINEL=1\n' > .env
      - name: Build and start Docker service
        run: docker compose up -d --build
      - name: Wait for healthcheck
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker compose ps -q bilipdj)"
          test -n "$container"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs --no-color
              exit 1
            fi
            sleep 1
          done
          docker compose logs --no-color
          echo "Docker healthcheck did not become healthy in time"
          exit 1
      - name: Verify ignored local files were not copied into image
        run: |
          container="$(docker compose ps -q bilipdj)"
          docker exec "$container" sh -ec '
            test ! -e /app/core/config.yaml
            test ! -e /app/core/cd/context-leak-sentinel.txt
            test ! -e /app/apps/server/__pycache__/context-leak-sentinel.pyc
          '
      - name: Verify host Web and local-only API access
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          for path in ('/health', '/control', '/config', '/index'):
              with urllib.request.urlopen('http://127.0.0.1:9816' + path, timeout=5) as response:
                  assert response.status == 200, (path, response.status)

          with urllib.request.urlopen('http://127.0.0.1:9816/api/config/basic', timeout=5) as response:
              payload = json.load(response)
              assert isinstance(payload, dict)

          request = urllib.request.Request(
              'http://127.0.0.1:9816/api/config/basic',
              headers={'Host': 'example.invalid'},
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 403
          else:
              raise AssertionError('non-loopback management Host header must be rejected')
          PY
      - name: Verify persistent data mount
        run: |
          container="$(docker compose ps -q bilipdj)"
          docker exec "$container" sh -ec 'test "$BILIPDJ_DATA_DIR" = /data; test -d /data/core/cd; test -d /data/key; test -d /data/log; test -d /data/plugins; test -f /data/style.json; test -f /data/appearance.json'
          test -d data/core/cd
          test -d data/key
          test -d data/plugins
      - name: Verify Docker Web parity and durable generated CSS
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker compose ps -q bilipdj)"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$container")" = true
          docker exec "$container" sh -ec '
            test -w /data
            test ! -d /app/apps/windows
            python -c "import quickjs, cryptography, PIL, google.protobuf; print(\"server dependencies OK\")"
          '
          python - <<'PY'
          import json, urllib.request
          base = "http://127.0.0.1:9816"
          for path in ("/health", "/control", "/config", "/index", "/api/control/meta",
                       "/api/config/basic", "/api/queue/state", "/api/queue/archive",
                       "/api/runtime-status", "/api/platforms/active", "/api/style", "/api/appearance"):
              with urllib.request.urlopen(base + path, timeout=8) as response:
                  content = response.read()
                  assert response.status == 200 and content, path
                  if path.startswith("/api/"):
                      assert isinstance(json.loads(content), dict), path
                  if path == "/api/control/meta":
                      assert json.loads(content).get("deployment") == "docker"
                  if path == "/control":
                      assert b"queue-next" in content, "not the canonical Web UI"
          def post(path, data):
              req = urllib.request.Request(base + path, data=json.dumps(data).encode(),
                                           headers={"Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=12) as response:
                  return json.load(response)
          assert post("/api/queue/insert", {"after": 0, "entry": "DockerSmokePersist_301"}).get("status") == "ok"
          assert post("/api/style", {"text_color": "#a1b2c3"}).get("status") == "ok"
          with urllib.request.urlopen(base + "/moren.css", timeout=8) as response:
              assert b"#a1b2c3" in response.read()
          PY
          docker exec "$container" sh -ec 'test -f /data/moren.css; grep -q "#a1b2c3" /data/moren.css'
          docker compose restart bilipdj
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            test "$status" != unhealthy
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          python - <<'PY'
          import json, urllib.request
          base = "http://127.0.0.1:9816"
          with urllib.request.urlopen(base + "/api/queue/state", timeout=8) as response:
              assert "DockerSmokePersist_301" in str(json.load(response).get("queue", []))
          with urllib.request.urlopen(base + "/api/style", timeout=8) as response:
              assert json.load(response).get("text_color") == "#a1b2c3"
          with urllib.request.urlopen(base + "/moren.css", timeout=8) as response:
              assert b"#a1b2c3" in response.read()
          print("Docker Web, OBS styles, queue persistence: OK")
          PY
      - name: Reject another container as management client
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker compose ps -q bilipdj)"
          network="$(docker inspect "$container" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          test -n "$network"
          docker run --rm -i --network "$network" python:3.11-slim python - <<'PY'
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              'http://bilipdj:9816/api/config/basic',
              headers={'Host': '127.0.0.1:9816'},
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              if exc.code == 403:
                  raise SystemExit(0)
              raise
          raise SystemExit('another container unexpectedly accessed local-only API')
          PY
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker service
        if: always()
        run: docker compose down -v --remove-orphans
