name: Validate Server

on:
  workflow_dispatch:
  push:
    branches: [now]
    paths: ['apps/server/**', 'apps/web/**', 'core/**', 'docker-compose.yml', '.dockerignore', 'scripts/redtv_issue121_guard.py', 'scripts/issue123_regression_guard.py', 'scripts/issue126_security_guard.py', 'scripts/issue128_plugin_architecture_guard.py', 'scripts/issue130_plugin_manager_guard.py', 'scripts/issue130_plugin_hardening_guard.py', 'scripts/issue130_js_runtime_probe.py', 'scripts/issue132_plugin_api_security_guard.py', 'scripts/issue134_plugin_mutation_guard.py', 'requirements.txt']
  pull_request:
    paths: ['apps/server/**', 'apps/web/**', 'core/**', 'docker-compose.yml', '.dockerignore', 'scripts/redtv_issue121_guard.py', 'scripts/issue123_regression_guard.py', 'scripts/issue126_security_guard.py', 'scripts/issue128_plugin_architecture_guard.py', 'scripts/issue130_plugin_manager_guard.py', 'scripts/issue130_plugin_hardening_guard.py', 'scripts/issue130_js_runtime_probe.py', 'scripts/issue132_plugin_api_security_guard.py', 'scripts/issue134_plugin_mutation_guard.py', 'requirements.txt']

jobs:
  validate-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q apps/server core scripts/redtv_issue121_guard.py scripts/issue123_regression_guard.py scripts/issue126_security_guard.py scripts/issue128_plugin_architecture_guard.py scripts/issue130_plugin_manager_guard.py scripts/issue130_plugin_hardening_guard.py scripts/issue130_js_runtime_probe.py scripts/issue132_plugin_api_security_guard.py scripts/issue134_plugin_mutation_guard.py
      - name: Red TV issue 121 regression guard
        run: python scripts/redtv_issue121_guard.py
      - name: Issue 123 regression guard
        run: python scripts/issue123_regression_guard.py
      - name: Issue 126 security regression guard
        run: python scripts/issue126_security_guard.py
      - name: Issue 128 plugin architecture guard
        run: python scripts/issue128_plugin_architecture_guard.py
      - name: Issue 130 QuickJS runtime probe
        run: python scripts/issue130_js_runtime_probe.py
      - name: Issue 130 plugin manager regression guard
        run: python scripts/issue130_plugin_manager_guard.py
      - name: Issue 130 plugin hardening guard
        run: python scripts/issue130_plugin_hardening_guard.py
      - name: Issue 132 plugin API security guard
        run: python scripts/issue132_plugin_api_security_guard.py
      - name: Issue 134 plugin mutation guard
        run: python scripts/issue134_plugin_mutation_guard.py
      - name: Validate migrated backend entry point
        run: |
          python - <<'PY'
          import importlib
          from apps.server.main import configure_web_assets
          backend = importlib.import_module('apps.server.server')
          legacy = importlib.import_module('core.server')
          assert backend is legacy
          assert 'apps/server/server.py' in backend.__file__.replace('\\', '/')
          path = configure_web_assets()
          assert (path / 'index.html').is_file()
          print(backend.__file__)
          print(path)
          PY

  docker-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Seed ignored build-context sentinels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data core/cd apps/server/__pycache__
          printf 'context-leak-sentinel\n' > data/context-leak-sentinel.txt
          printf 'context-leak-sentinel: true\n' > core/config.yaml
          printf 'context-leak-sentinel\n' > core/cd/context-leak-sentinel.txt
          printf 'context-leak-sentinel\n' > apps/server/__pycache__/context-leak-sentinel.pyc
          printf 'CONTEXT_LEAK_SENTINEL=1\n' > .env
      - name: Build and start Docker service
        run: docker compose up -d --build
      - name: Wait for healthcheck
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker compose ps -q bilipdj)"
          test -n "$container"
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container")"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker compose logs --no-color
              exit 1
            fi
            sleep 1
          done
          docker compose logs --no-color
          echo "Docker healthcheck did not become healthy in time"
          exit 1
      - name: Verify ignored local files were not copied into image
        run: |
          container="$(docker compose ps -q bilipdj)"
          docker exec "$container" sh -ec '
            test ! -e /app/core/config.yaml
            test ! -e /app/core/cd/context-leak-sentinel.txt
            test ! -e /app/apps/server/__pycache__/context-leak-sentinel.pyc
          '
      - name: Verify host Web and local-only API access
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          for path in ('/health', '/control', '/config', '/index'):
              with urllib.request.urlopen('http://127.0.0.1:9816' + path, timeout=5) as response:
                  assert response.status == 200, (path, response.status)

          with urllib.request.urlopen('http://127.0.0.1:9816/api/config/basic', timeout=5) as response:
              payload = json.load(response)
              assert isinstance(payload, dict)

          request = urllib.request.Request(
              'http://127.0.0.1:9816/api/config/basic',
              headers={'Host': 'example.invalid'},
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 403
          else:
              raise AssertionError('non-loopback management Host header must be rejected')
          PY
      - name: Verify persistent data mount
        run: |
          container="$(docker compose ps -q bilipdj)"
          docker exec "$container" sh -ec 'test "$BILIPDJ_DATA_DIR" = /data; test -d /data/core/cd; test -d /data/key; test -d /data/log; test -d /data/plugins; test -f /data/style.json; test -f /data/appearance.json'
          test -d data/core/cd
          test -d data/key
          test -d data/plugins
      - name: Reject another container as management client
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker compose ps -q bilipdj)"
          network="$(docker inspect "$container" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')"
          test -n "$network"
          docker run --rm -i --network "$network" python:3.11-slim python - <<'PY'
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              'http://bilipdj:9816/api/config/basic',
              headers={'Host': '127.0.0.1:9816'},
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              if exc.code == 403:
                  raise SystemExit(0)
              raise
          raise SystemExit('another container unexpectedly accessed local-only API')
          PY
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker service
        if: always()
        run: docker compose down -v --remove-orphans
