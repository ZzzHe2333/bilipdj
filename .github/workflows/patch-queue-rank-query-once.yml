name: Patch queue rank query once

on:
  push:
    branches: [now]
    paths:
      - .github/queue-rank-query.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - name: Add queue rank query interface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/server.py")
          source = path.read_text(encoding="utf-8")

          marker = '''    # 判断弹幕是否属于"排队类指令"（不含管理员专属指令）
              _JOIN_CMD_PATTERNS = (
          '''
          replacement = '''    # 当前仅提供日志查询接口，不发送自动回复弹幕。
              _QUEUE_RANK_QUERY_COMMANDS = frozenset({"我的排队", "我的名次"})

              # 判断弹幕是否属于"排队类指令"（不含管理员专属指令）
              _JOIN_CMD_PATTERNS = (
          '''
          if marker not in source:
              raise SystemExit("queue command marker not found")
          source = source.replace(marker, replacement, 1)

          marker = '''    def _is_command_like(self, msg: str) -> bool:
                  return self._is_non_admin_command(msg) or self._is_admin_command(msg)

              def _process(
          '''
          replacement = '''    def _is_command_like(self, msg: str) -> bool:
                  return self._is_non_admin_command(msg) or self._is_admin_command(msg)

              def query_queue_rank(self, uid: int, uname: str, msg: str) -> dict[str, Any] | None:
                  """Return and log a user's current queue rank for supported query phrases.

                  This is intentionally a read-only interface. It does not broadcast a
                  WebSocket event, send a live-room reply, or mutate the queue.
                  """
                  command = str(msg or "").strip()
                  if command not in self._QUEUE_RANK_QUERY_COMMANDS:
                      return None

                  user_name = str(uname or "").strip()
                  with self._lock:
                      index = self._find_index(user_name)
                      total = len(self._persons)

                  queued = index >= 0
                  rank = index + 1 if queued else None
                  if queued:
                      message = f"当前排在第 {rank} 位，队列共 {total} 人"
                  else:
                      message = f"当前不在排队列表中，队列共 {total} 人"

                  result = {
                      "handled": True,
                      "command": command,
                      "uid": int(uid or 0),
                      "uname": user_name,
                      "queued": queued,
                      "rank": rank,
                      "total": total,
                      "message": message,
                  }
                  self._logger.info(
                      "[智能查询] %s(%s) 发送%r：%s",
                      user_name,
                      int(uid or 0),
                      command,
                      message,
                  )
                  return result

              def _process(
          '''
          if marker not in source:
              raise SystemExit("process insertion marker not found")
          source = source.replace(marker, replacement, 1)

          marker = '''    ) -> tuple[bool, str | None]:
                  with self._lock:
                      has_op = self._has_op_permission(uname, is_anchor, is_admin)
          '''
          replacement = '''    ) -> tuple[bool, str | None]:
                  if self.query_queue_rank(uid, uname, msg) is not None:
                      return False, None

                  with self._lock:
                      has_op = self._has_op_permission(uname, is_anchor, is_admin)
          '''
          if marker not in source:
              raise SystemExit("process body marker not found")
          source = source.replace(marker, replacement, 1)

          path.write_text(source, encoding="utf-8")
          PY

          cat > tests/test_queue_rank_query.py <<'PY'
          from __future__ import annotations

          import io
          import logging
          import unittest

          from core.server import QueueManager


          class _Hub:
              pass


          class _Archive:
              pass


          class QueueRankQueryTests(unittest.TestCase):
              def setUp(self) -> None:
                  self.stream = io.StringIO()
                  self.logger = logging.getLogger(f"queue-rank-test-{id(self)}")
                  self.logger.handlers.clear()
                  self.logger.propagate = False
                  self.logger.setLevel(logging.INFO)
                  self.logger.addHandler(logging.StreamHandler(self.stream))
                  self.manager = QueueManager(_Hub(), _Archive(), self.logger)
                  self.manager._persons = ["官|小明 任务甲", "小红 任务乙", "<小刚>任务丙"]
                  self.manager._entry_timestamps = ["", "", ""]

              def test_supported_phrases_return_current_rank(self) -> None:
                  first = self.manager.query_queue_rank(101, "小明", "我的排队")
                  second = self.manager.query_queue_rank(102, "小红", "我的名次")

                  self.assertEqual(first["rank"], 1)
                  self.assertEqual(second["rank"], 2)
                  self.assertEqual(second["total"], 3)
                  self.assertTrue(second["queued"])
                  self.assertIn("[智能查询]", self.stream.getvalue())
                  self.assertIn("第 2 位", self.stream.getvalue())

              def test_missing_user_is_logged_without_mutating_queue(self) -> None:
                  before = list(self.manager._persons)
                  result = self.manager.query_queue_rank(103, "未排队用户", "我的名次")

                  self.assertFalse(result["queued"])
                  self.assertIsNone(result["rank"])
                  self.assertEqual(result["total"], 3)
                  self.assertEqual(self.manager._persons, before)
                  self.assertIn("不在排队列表", self.stream.getvalue())

              def test_unrelated_message_is_not_handled(self) -> None:
                  self.assertIsNone(self.manager.query_queue_rank(104, "小红", "排队"))

              def test_process_consumes_query_without_queue_change(self) -> None:
                  before = list(self.manager._persons)
                  modified, note = self.manager._process(
                      102, "小红", "我的排队", False, False, False, 0
                  )
                  self.assertFalse(modified)
                  self.assertIsNone(note)
                  self.assertEqual(self.manager._persons, before)


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Validate
        shell: bash
        run: |
          python -m py_compile core/server.py
          python -m unittest tests.test_queue_rank_query

      - name: Commit result and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-queue-rank-query-once.yml .github/queue-rank-query.trigger
          git add core/server.py tests/test_queue_rank_query.py
          git commit -m "feat: log personal queue rank queries"
          git push origin HEAD:now
