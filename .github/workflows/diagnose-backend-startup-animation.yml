name: Diagnose backend startup animation patch

on:
  push:
    branches:
      - fix/backend-startup-animation-v2
    paths:
      - .github/workflows/diagnose-backend-startup-animation.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-startup-animation-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply prepared patch
        run: |
          git fetch origin fix/backend-startup-animation
          git show origin/fix/backend-startup-animation:.github/workflows/apply-backend-startup-animation.yml > /tmp/backend-startup-patch.yml
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('/tmp/backend-startup-patch.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python - <<'PY'\n(.*?)^          PY$", workflow)
          if match is None:
              raise RuntimeError('unable to extract backend startup patch script')
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in match.group(1).splitlines()
          )
          exec(compile(script, 'apply_backend_startup_animation.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run each validation independently
        shell: bash
        run: |
          set +e
          : > backend-startup-animation-validation.log

          echo '=== compileall ===' >> backend-startup-animation-validation.log
          python -m compileall -q core tests >> backend-startup-animation-validation.log 2>&1
          COMPILE_STATUS=$?

          echo '=== unittest ===' >> backend-startup-animation-validation.log
          python -m unittest discover -s tests -v >> backend-startup-animation-validation.log 2>&1
          TEST_STATUS=$?

          echo '=== secret scan ===' >> backend-startup-animation-validation.log
          python scripts/scan_secrets.py >> backend-startup-animation-validation.log 2>&1
          SECRET_STATUS=$?

          echo '=== diff check ===' >> backend-startup-animation-validation.log
          git diff --check >> backend-startup-animation-validation.log 2>&1
          DIFF_STATUS=$?

          printf '\ncompile=%s test=%s secret=%s diff=%s\n' \
            "$COMPILE_STATUS" "$TEST_STATUS" "$SECRET_STATUS" "$DIFF_STATUS" \
            >> backend-startup-animation-validation.log
          cat backend-startup-animation-validation.log

      - name: Preserve patched source and validation log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/control_panel.py tests/test_backend_startup_animation.py backend-startup-animation-validation.log
          git commit -m "chore: preserve startup animation patch validation"
          git push origin HEAD:fix/backend-startup-animation-v2

