name: Quality and API compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
  push:
    branches: [now]
    paths:
      - 'apps/**'
      - 'core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q apps core scripts tests
      - name: Run regression tests
        id: tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-results
          path: test-results.txt
          if-no-files-found: error
