name: Quality and API compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'core/**'
      - 'scripts/**'
      - 'packages/shared/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  push:
    branches: [now]
    paths:
      - 'apps/**'
      - 'core/**'
      - 'scripts/**'
      - 'packages/shared/**'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q apps core scripts
      - name: Validate Huya protocol framing
        run: python apps/server/huya_protocol_guard.py
      - name: Validate red TV chat parser
        run: python apps/server/youtube_protocol_guard.py
      - name: Validate purple mouse chat parser
        run: python apps/server/twitch_protocol_guard.py
      - name: Validate packaging entry syntax
        run: |
          bash -n apps/windows/package-macos.sh
          python -m py_compile \
            apps/windows/bilipdj_onedir.spec \
            apps/windows/paiduijitm.spec \
            apps/windows/updater.spec \
            apps/windows/bilipdj_onedir_mac.spec \
            apps/windows/paiduijitm_mac.spec \
            apps/web/web_portable.spec
      - name: Validate backend import boundary
        run: |
          python - <<'PY'
          import importlib
          backend = importlib.import_module('apps.server.server')
          legacy = importlib.import_module('core.server')
          assert backend is legacy
          assert 'apps/server/server.py' in backend.__file__.replace('\\', '/')
          print('backend:', backend.__file__)
          PY
      - name: Validate API documentation coverage
        run: python scripts/generate_api_docs.py --output /tmp/bilipdj-api
      - name: Validate Web source build
        run: python apps/web/build.py
      - name: Validate key generated Web files
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/config.html
          test -f apps/web/dist/control.html
          test -f apps/web/dist/myjs.js
