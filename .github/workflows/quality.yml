name: Quality and API compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'core/**'
      - '.github/ci/**'
      - '.agents/**'
      - 'packages/shared/**'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/**'
  push:
    branches: [now]
    paths:
      - 'apps/**'
      - 'core/**'
      - '.github/ci/**'
      - '.agents/**'
      - 'packages/shared/**'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q apps core .github/ci
      - name: Validate production GUI dependency boundary
        run: python .github/ci/production_gui_dependency_guard.py
      - name: Validate explicit-only release policy
        run: python .github/ci/issue138_release_policy_guard.py
      - name: Validate release download guidance
        run: python .github/ci/release_download_guidance_guard.py
      - name: Validate updater backup repository
        run: python .github/ci/issue150_updater_backup_guard.py
      - name: Validate incremental updater
        run: python .github/ci/issue155_incremental_update_guard.py
      - name: Validate command/update/runtime layout migration
        run: python .github/ci/issue167_runtime_layout_guard.py
      - name: Validate Docker foundation
        run: python .github/ci/issue202_docker_guard.py
      - name: Validate Docker build-context privacy
        run: python .github/ci/issue204_docker_context_guard.py
      - name: Validate Emil skills and UI polish
        run: python .github/ci/issue171_ui_polish_guard.py
      - name: Validate update version selector and stable layout
        run: python .github/ci/issue175_update_version_guard.py
      - name: Validate Web Portable updater
        run: python .github/ci/issue179_web_updater_guard.py
      - name: Smoke-test Web updater HTTP host
        run: python .github/ci/issue179_web_updater_smoke.py
      - name: Validate Web/desktop issue 185 regressions
        run: python .github/ci/issue185_regression_guard.py
      - name: Validate fixed Windows control-panel size
        run: python .github/ci/issue194_fixed_window_guard.py
      - name: Validate compact Windows log toolbar
        run: python .github/ci/issue196_log_toolbar_guard.py
      - name: Validate stable Windows navigation geometry
        run: python .github/ci/issue209_nav_stability_guard.py
      - name: Validate Tk/ttk desktop rollback
        run: python .github/ci/issue217_customtkinter_guard.py
      - name: Validate issue 213 updater/theme/version regressions
        run: python .github/ci/issue213_regression_guard.py
      - name: Validate backup content options
        run: python .github/ci/issue246_backup_options_guard.py
      - name: Validate cross-platform gift compatibility
        run: python .github/ci/issue248_gift_compatibility_guard.py
      - name: Validate language plugins and runtime translation
        run: python .github/ci/issue250_language_plugin_guard.py
      - name: Validate bundled English and single-active language policy
        run: python .github/ci/issue252_bundled_english_guard.py
      - name: Validate issue 260 five bug fixes
        run: python .github/ci/issue260_five_bug_guard.py
      - name: Validate issue 262 bug fixes and scripts decoupling
        run: python .github/ci/issue262_six_bug_and_scripts_guard.py
      - name: Validate Huya protocol framing
        run: python apps/server/huya_protocol_guard.py
      - name: Validate red TV chat parser
        run: python apps/server/youtube_protocol_guard.py
      - name: Validate purple mouse chat parser
        run: python apps/server/twitch_protocol_guard.py
      - name: Validate packaging entry syntax
        run: |
          bash -n apps/windows/package-macos.sh
          python -m py_compile \
            apps/windows/bilipdj_onedir.spec \
            apps/windows/paiduijitm.spec \
            apps/windows/updater.spec \
            apps/windows/bilipdj_onedir_mac.spec \
            apps/windows/paiduijitm_mac.spec \
            apps/web/web_portable.spec \
            apps/web/web_updater.spec
      - name: Validate backend import boundary
        run: |
          python - <<'PY'
          import importlib
          backend = importlib.import_module('apps.server.server')
          legacy = importlib.import_module('core.server')
          assert backend is legacy
          assert 'apps/server/server.py' in backend.__file__.replace('\\', '/')
          print('backend:', backend.__file__)
          PY
      - name: Validate API documentation coverage
        run: python .github/ci/generate_api_docs.py --output /tmp/bilipdj-api
      - name: Validate Web source build
        run: python apps/web/build.py
      - name: Validate stable Web scrollbar gutter
        run: python .github/ci/issue148_scrollbar_jitter_guard.py
      - name: Validate key generated Web files
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/config.html
          test -f apps/web/dist/control.html
          test -f apps/web/dist/myjs.js
          test -f apps/web/dist/issue167_control_extensions.js
          test -f apps/web/dist/web_updater_control.js
          test -f apps/web/dist/web_updater_control.css
          test -f apps/web/dist/i18n.js
          test -f apps/web/dist/languages/en-US.json
          grep -q 'issue167_control_extensions.js' apps/web/dist/control.html
