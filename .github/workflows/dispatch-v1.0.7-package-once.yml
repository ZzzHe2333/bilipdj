name: Dispatch and monitor v1.0.7 package

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/dispatch-v1.0.7-package-once.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0
      - name: Dispatch Windows package workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run package-windows-x64.yml --ref v1.0.7 -f tag_name=v1.0.7
          sleep 10
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/package-windows-x64.yml/runs?event=workflow_dispatch&per_page=10" --jq '.workflow_runs[] | select(.head_branch=="v1.0.7") | .id' | head -n 1)
          test -n "$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Monitor package and record result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run watch "$RUN_ID" --exit-status
          WATCH_STATUS=$?
          set -e
          export WATCH_STATUS
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" > /tmp/run.json
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" > /tmp/jobs.json
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" > /tmp/artifacts.json
          gh api "repos/${{ github.repository }}/releases/tags/v1.0.7" > /tmp/release.json 2>/tmp/release-error.txt || true
          python - <<'PY'
          import json, pathlib, os
          run=json.load(open('/tmp/run.json'))
          jobs=json.load(open('/tmp/jobs.json'))
          artifacts=json.load(open('/tmp/artifacts.json'))
          release_path=pathlib.Path('/tmp/release.json')
          release=json.load(open(release_path)) if release_path.exists() and release_path.stat().st_size else None
          out={
            'watch_status':int(os.environ.get('WATCH_STATUS','0')),
            'run':{k:run.get(k) for k in ('id','status','conclusion','html_url','head_sha','head_branch','event','created_at','updated_at')},
            'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{k:s.get(k) for k in ('name','status','conclusion','number')} for s in j.get('steps',[])]} for j in jobs.get('jobs',[])],
            'artifacts':[{k:a.get(k) for k in ('id','name','size_in_bytes','expired','created_at')} for a in artifacts.get('artifacts',[])],
            'release':None if release is None else {k:release.get(k) for k in ('id','tag_name','name','html_url','draft','prerelease','published_at','body')},
            'assets':[] if release is None else [{k:a.get(k) for k in ('id','name','size','browser_download_url','content_type','state')} for a in release.get('assets',[])]
          }
          pathlib.Path('/tmp/v1.0.7-package-final.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git checkout --orphan diagnostic-v1.0.7-package-final
          git rm -rf .
          cp /tmp/v1.0.7-package-final.json .
          git add v1.0.7-package-final.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record final v1.0.7 package result'
          git push --force origin HEAD:diagnostic/v1.0.7-package-final
      - name: Remove temporary workflows
        run: |
          git checkout now
          git pull --ff-only origin now
          git rm -f --ignore-unmatch .github/workflows/dispatch-v1.0.7-package-once.yml .github/workflows/inspect-v1.0.7-package-once.yml
          git commit -m 'chore: remove v1.0.7 package helpers'
          git push origin HEAD:now

# Trigger after workflow registration.
