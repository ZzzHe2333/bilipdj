name: Add queue display options once

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/add-queue-display-options-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode and apply patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ''''''
          Path('/tmp/apply_queue_display_options.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply_queue_display_options.py

      - name: Validate Python and JavaScript
        shell: bash
        run: |
          python -m compileall -q core tests
          node --check core/ui/myjs.js
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit implementation and clean workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-queue-display-options-once.yml
          git add core tests
          git commit -m 'feat: add automatic queue scrolling and sequence display'
          git push origin HEAD:now
