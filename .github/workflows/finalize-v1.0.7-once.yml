name: Finalize v1.0.7 once

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/finalize-v1.0.7-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare release branch
        run: |
          git fetch origin release/v1.0.7
          git checkout -B release/v1.0.7 origin/release/v1.0.7
          python scripts/prepare_v1_0_7.py
          python -m compileall -q core tests
          python -m unittest discover -s tests -v
          python scripts/scan_secrets.py
          git diff --check
          grep -q 'APP_VERSION = "1.0.7"' core/control_panel.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/release-v1.0.7.yml .github/workflows/release-v1.0.7-trigger.yml .github/workflows/release-v1.0.7-trigger-2.yml .github/workflows/finalize-v1.0.7.yml release-v1.0.7-trigger.txt repo-files.txt repo-inspection.txt scripts/prepare_v1_0_7.py
          git add core/control_panel.py UPDATE.md RELEASE_NOTES.md .github/workflows/package-windows-x64.yml
          git commit -m 'release: prepare v1.0.7'
          git push origin HEAD:release/v1.0.7
      - name: Remove temporary workflow from now
        run: |
          git checkout now
          git pull --ff-only origin now
          git rm .github/workflows/finalize-v1.0.7-once.yml
          git commit -m 'chore: remove v1.0.7 finalizer'
          git push origin HEAD:now
