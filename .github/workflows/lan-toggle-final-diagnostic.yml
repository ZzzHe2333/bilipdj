name: Diagnose final LAN toggle patch

on:
  pull_request:
    branches: [now]
    paths:
      - .github/workflows/lan-toggle-final-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture final traceback
        shell: bash
        run: |
          set +e
          python - <<'PY' > lan-toggle-final-error.log 2>&1
          from pathlib import Path
          import re
          import textwrap
          import traceback
          workflow = Path('.github/workflows/apply-lan-listen-toggle-final.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python - <<'PY'\n(.*?)^          PY$", workflow)
          if match is None:
              raise RuntimeError('unable to extract final patch script')
          script = textwrap.dedent(match.group(1))
          try:
              exec(compile(script, 'apply_lan_toggle_final.py', 'exec'), {'__name__': '__main__'})
          except Exception:
              traceback.print_exc()
              raise
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f lan-toggle-final-error.log
          git commit -m "chore: capture final LAN toggle error" || true
          git push origin "HEAD:${{ github.head_ref }}"
          exit 0
