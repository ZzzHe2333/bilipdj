name: Dispatch v3.0.13-test release once

on:
  push:
    branches:
      - now
    paths:
      - 'VERSION'
      - '.github/workflows/release-v3.0.13-test-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    if: github.repository == 'ZzzHe2333/bilipdj'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate requested version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION" != "3.0.13-test" ]; then
            echo "One-time release dispatcher only permits 3.0.13-test; current VERSION=$VERSION"
            exit 1
          fi

      - name: Check whether release already exists
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.0.13-test --repo ZzzHe2333/bilipdj >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v3.0.13-test already exists; no dispatch needed."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch explicit release workflow
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run package-windows-x64.yml \
            --repo ZzzHe2333/bilipdj \
            --ref now \
            -f tag_name=v3.0.13-test
          echo "Explicit v3.0.13-test release workflow dispatched."
