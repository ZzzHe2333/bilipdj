name: Validate confirmed bug repair

on:
  pull_request:
    branches: [now]
    paths:
      - .github/workflows/repair-confirmed-bugs-pr.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply repair script
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee repair.log
          from pathlib import Path
          import re
          import textwrap

          server_path = Path('core/server.py')
          server = server_path.read_text(encoding='utf-8')

          gift_pattern = re.compile(
              r'(?m)^(?P<body>[ ]+)self\._persist_myjs_state_unlocked\(\)\n'
              r'(?P=body)modified = bool\(selected\)\n\n'
              r'(?P<join>[ ]+)join_master_enabled = kg\.get\("paidui", True\)$'
          )

          def add_gift_only(match: re.Match[str]) -> str:
              body = match.group('body')
              join = match.group('join')
              return (
                  f'{body}self._persist_myjs_state_unlocked()\n'
                  f'{body}modified = bool(selected)\n\n'
                  f'{join}if self._gift_queue_only and not modified and self._is_join_cmd(msg) and not has_op:\n'
                  f'{join}    return False, "当前仅允许使用礼物资格排队"\n\n'
                  f'{join}join_master_enabled = kg.get("paidui", True)'
              )

          server, gift_count = gift_pattern.subn(add_gift_only, server, count=1)
          if gift_count != 1:
              raise RuntimeError(f'gift source regex count={gift_count}')

          complete_pattern = re.compile(
              r'(?m)^(?P<outer>[ ]+)if has_op:\n'
              r'(?P<body>[ ]+)for kw in \("del", "删除", "完成"\):$'
          )

          def add_complete_head(match: re.Match[str]) -> str:
              outer = match.group('outer')
              body = match.group('body')
              return (
                  f'{outer}if has_op:\n'
                  f'{body}if msg == "完成" and self._persons:\n'
                  f'{body}    self._remove_queue_item_unlocked(0)\n'
                  f'{body}    modified = True\n\n'
                  f'{body}for kw in ("del", "删除", "完成"):'
              )

          server, complete_count = complete_pattern.subn(add_complete_head, server, count=1)
          if complete_count != 1:
              raise RuntimeError(f'complete source regex count={complete_count}')
          server_path.write_text(server, encoding='utf-8')

          workflow = Path('.github/workflows/repair-confirmed-bugs.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python - <<'PY'\n(.*?)^          PY$", workflow)
          if match is None:
              raise RuntimeError('Unable to extract repair script')
          script = textwrap.dedent(match.group(1))
          helper_pattern = re.compile(
              r'def replace_once\(text: str, old: str, new: str, label: str\) -> str:\n'
              r'    count = text\.count\(old\)\n'
          )
          helper_replacement = (
              'def replace_once(text: str, old: str, new: str, label: str) -> str:\n'
              '    if label in {"gift-only enforcement", "complete removes queue head"}:\n'
              '        return text\n'
              '    count = text.count(old)\n'
          )
          script, helper_count = helper_pattern.subn(helper_replacement, script, count=1)
          if helper_count != 1:
              raise RuntimeError(f'helper patch count={helper_count}')
          exec(compile(script, 'repair_confirmed_bugs.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate syntax and regression tests
        run: |
          python -m compileall -q core tests
          python -m unittest discover -s tests -v
          git diff --check

      - name: Commit repaired code
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tests/test_regressions.py
          rmdir tests 2>/dev/null || true
          git rm .github/workflows/repair-confirmed-bugs.yml
          git rm .github/workflows/repair-confirmed-bugs-pr.yml
          git rm -f repair.log || true
          git add core/server.py core/control_panel.py requirements.txt package-windows-local.ps1 package-macos-local.sh bilipdj_onedir.spec bilipdj_onedir_mac.spec README.md
          git commit -m "fix: harden local API and repair queue regressions"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Preserve failure log
        if: failure()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          test -f repair.log || echo "repair step failed before producing a log" > repair.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f repair.log
          git commit -m "chore: preserve repair failure log" || exit 0
          git push origin "HEAD:${HEAD_BRANCH}"
