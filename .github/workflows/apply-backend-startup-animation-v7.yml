name: Apply backend startup animation v7

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/apply-backend-startup-animation-v7.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply prepared patch
        run: |
          git fetch origin fix/backend-startup-animation
          git show origin/fix/backend-startup-animation:.github/workflows/apply-backend-startup-animation.yml > /tmp/backend-startup-patch.yml
          python - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('/tmp/backend-startup-patch.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python - <<'PY'\n(.*?)^          PY$", workflow)
          if match is None:
              raise RuntimeError('unable to extract backend startup patch script')
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in match.group(1).splitlines()
          )
          exec(compile(script, 'apply_backend_startup_animation.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and record exact results
        id: validation
        shell: bash
        run: |
          set +e
          : > backend-startup-animation-validation-v7.log

          echo '=== compileall ===' >> backend-startup-animation-validation-v7.log
          python -m compileall -q core tests >> backend-startup-animation-validation-v7.log 2>&1
          COMPILE_STATUS=$?

          echo '=== unittest ===' >> backend-startup-animation-validation-v7.log
          python -m unittest discover -s tests -v >> backend-startup-animation-validation-v7.log 2>&1
          TEST_STATUS=$?

          echo '=== secret scan ===' >> backend-startup-animation-validation-v7.log
          python scripts/scan_secrets.py >> backend-startup-animation-validation-v7.log 2>&1
          SECRET_STATUS=$?

          echo '=== diff check ===' >> backend-startup-animation-validation-v7.log
          git diff --check >> backend-startup-animation-validation-v7.log 2>&1
          DIFF_STATUS=$?

          printf '\ncompile=%s test=%s secret=%s diff=%s\n' \
            "$COMPILE_STATUS" "$TEST_STATUS" "$SECRET_STATUS" "$DIFF_STATUS" \
            >> backend-startup-animation-validation-v7.log
          cat backend-startup-animation-validation-v7.log

          if [ "$COMPILE_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ] || [ "$SECRET_STATUS" -ne 0 ] || [ "$DIFF_STATUS" -ne 0 ]; then
            echo 'status=1' >> "$GITHUB_OUTPUT"
          else
            echo 'status=0' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Roll back source and preserve failure log
        if: steps.validation.outputs.status != '0'
        run: |
          git restore core/control_panel.py
          rm -f tests/test_backend_startup_animation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend-startup-animation-validation-v7.log
          git commit -m "chore: record startup animation validation failure"
          git push origin HEAD:now
          exit 1

      - name: Commit feature and clean all temporary diagnostics
        if: steps.validation.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/apply-backend-startup-animation-once.yml \
            .github/workflows/apply-backend-startup-animation-v2.yml \
            .github/workflows/apply-backend-startup-animation-v3.yml \
            .github/workflows/apply-backend-startup-animation-v4.yml \
            .github/workflows/apply-backend-startup-animation-v5.yml \
            .github/workflows/apply-backend-startup-animation-v6.yml \
            .github/workflows/apply-backend-startup-animation-v7.yml \
            .github/workflows/inspect-backend-startup-animation.yml \
            .github/workflows/inspect-backend-startup-animation-v6.yml \
            backend-startup-animation-status.json \
            backend-startup-animation-v6-status.json \
            backend-startup-animation-patch.log \
            backend-startup-animation-patch-v3.log \
            backend-startup-animation-validation.log \
            backend-startup-animation-validation-v6.log \
            backend-startup-animation-validation-v7.log
          git add core/control_panel.py tests/test_backend_startup_animation.py
          git commit -m "fix: keep backend startup UI responsive"
          git push origin HEAD:now
