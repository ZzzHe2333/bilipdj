name: Validate auto updater Windows v2

on:
  push:
    branches:
      - now
    paths:
      - .github/workflows/validate-auto-updater-windows-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/auto-updater
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and build
        id: validate
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r requirements.txt
          python -m compileall -q core tests
          python -m unittest discover -s tests -v
          python scripts\scan_secrets.py
          .\scripts\package-amd64.ps1 -InstallDependencies
          if (-not (Test-Path dist\bilipdj\main.exe)) { throw 'main.exe missing' }
          if (-not (Test-Path dist\bilipdj\paiduijitm.exe)) { throw 'paiduijitm.exe missing' }
          if (-not (Test-Path dist\bilipdj\updater.exe)) { throw 'updater.exe missing' }
          Compress-Archive -Path dist\bilipdj\* -DestinationPath auto-updater-test.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 auto-updater-test.zip).Hash.ToLowerInvariant()
          "$hash  auto-updater-test.zip" | Set-Content auto-updater-test.zip.sha256 -Encoding ascii
          if ((Get-Item auto-updater-test.zip.sha256).Length -lt 64) { throw 'checksum missing' }
      - name: Record result
        if: always()
        shell: bash
        run: |
          printf '{"outcome":"%s","head_sha":"%s"}\n' "${{ steps.validate.outcome }}" "$(git rev-parse HEAD)" > /tmp/auto-updater-windows-v2.json
          git checkout --orphan diagnostic-auto-updater-windows-v2
          git rm -rf .
          cp /tmp/auto-updater-windows-v2.json .
          git add auto-updater-windows-v2.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record auto-updater Windows v2 result"
          git push --force origin HEAD:diagnostic/auto-updater-windows-v2
      - name: Fail when validation failed
        if: steps.validate.outcome != 'success'
        shell: pwsh
        run: throw 'Windows validation failed'
