name: One-time stale branch cleanup

on:
  push:
    branches: [now]
    paths:
      - '.github/workflows/cleanup-stale-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete approved stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          stale_branches=(
            'issue-179-web-updater-test'
            'issue-185-web-settings-freeze-incremental-fix'
            'issue-187-placeholder'
            'noop-temp-check'
            'release/3.0.0-dispatch'
            'release-notes/v3.0.2'
            'release-publish/v3.0.2'
            'release-publish/v3.0.3-test'
            'release-publish/v3.0.4-test'
            'tmp-noop'
          )

          for branch in "${stale_branches[@]}"; do
            if [[ "$branch" == 'now' || "$branch" == 'feature/granular-admin-permissions' ]]; then
              echo "Refusing to delete protected branch: $branch" >&2
              exit 1
            fi

            if ! git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Already absent: $branch"
              continue
            fi

            open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
            if [[ "$open_prs" != '0' ]]; then
              echo "Refusing to delete branch with an open PR: $branch" >&2
              exit 1
            fi

            echo "Deleting stale branch: $branch"
            git push origin --delete "$branch"
          done

      - name: Verify retained branches
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --exit-code --heads origin refs/heads/now >/dev/null
          git ls-remote --exit-code --heads origin refs/heads/feature/granular-admin-permissions >/dev/null

          for branch in \
            issue-179-web-updater-test \
            issue-185-web-settings-freeze-incremental-fix \
            issue-187-placeholder \
            noop-temp-check \
            release/3.0.0-dispatch \
            release-notes/v3.0.2 \
            release-publish/v3.0.2 \
            release-publish/v3.0.3-test \
            release-publish/v3.0.4-test \
            tmp-noop
          do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Stale branch still exists: $branch" >&2
              exit 1
            fi
          done
