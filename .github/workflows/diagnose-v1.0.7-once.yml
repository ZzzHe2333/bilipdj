name: Diagnose v1.0.7 once
on:
  push:
    branches: [now]
    paths: [.github/workflows/diagnose-v1.0.7-once.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose
        shell: bash
        run: |
          git fetch origin release/v1.0.7
          git checkout -B release/v1.0.7 origin/release/v1.0.7
          set +e
          : > /tmp/v1.0.7-diagnostic.log
          python scripts/prepare_v1_0_7.py >> /tmp/v1.0.7-diagnostic.log 2>&1; echo "prepare=$?" >> /tmp/v1.0.7-diagnostic.log
          python -m compileall -q core tests >> /tmp/v1.0.7-diagnostic.log 2>&1; echo "compile=$?" >> /tmp/v1.0.7-diagnostic.log
          python -m unittest discover -s tests -v >> /tmp/v1.0.7-diagnostic.log 2>&1; echo "tests=$?" >> /tmp/v1.0.7-diagnostic.log
          python scripts/scan_secrets.py >> /tmp/v1.0.7-diagnostic.log 2>&1; echo "secrets=$?" >> /tmp/v1.0.7-diagnostic.log
          git diff --check >> /tmp/v1.0.7-diagnostic.log 2>&1; echo "diff=$?" >> /tmp/v1.0.7-diagnostic.log
          git status --short >> /tmp/v1.0.7-diagnostic.log 2>&1
          git checkout --orphan diagnostic-v1.0.7
          git rm -rf .
          cp /tmp/v1.0.7-diagnostic.log .
          git add v1.0.7-diagnostic.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record v1.0.7 diagnostics'
          git push --force origin HEAD:diagnostic/v1.0.7
