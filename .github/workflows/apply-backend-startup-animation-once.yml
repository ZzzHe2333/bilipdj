name: Apply backend startup animation once

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/apply-backend-startup-animation-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Load and execute prepared patch
        run: |
          git fetch origin fix/backend-startup-animation
          git show origin/fix/backend-startup-animation:.github/workflows/apply-backend-startup-animation.yml > /tmp/backend-startup-patch.yml
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('/tmp/backend-startup-patch.yml').read_text(encoding='utf-8')
          match = re.search(
              r"(?ms)^          python - <<'PY'\n(.*?)^          PY$",
              workflow,
          )
          if match is None:
              raise RuntimeError('unable to extract backend startup patch script')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, 'apply_backend_startup_animation.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate patch
        run: |
          python -m compileall -q core tests
          python -m unittest discover -s tests -v
          python scripts/scan_secrets.py
          git diff --check

      - name: Commit feature and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-backend-startup-animation-once.yml
          git add core/control_panel.py tests/test_backend_startup_animation.py
          git commit -m "fix: keep backend startup UI responsive"
          git push origin HEAD:now
