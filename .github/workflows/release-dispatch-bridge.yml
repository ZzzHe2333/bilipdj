name: Explicit 3.0.17 stable release trigger

on:
  push:
    branches:
      - 'release-trigger/v3.0.17'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 3.0.17 stable release from preserved source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run package-windows-x64.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref release-source/v3.0.17 \
            -f tag_name="v3.0.17" \
            -f release_status="release"
