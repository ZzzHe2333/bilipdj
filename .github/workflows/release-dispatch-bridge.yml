name: Explicit release dispatch bridge

on:
  push:
    branches:
      - 'release-publish/v*'
      - 'release-publish-stable/v*'

# Creating one of these branches is an explicit publish action.
# - release-publish/vX.Y.Z: default/unspecified intent -> Pre-release
# - release-publish-stable/vX.Y.Z: explicitly requested formal Release
permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit release branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          RELEASE_STATUS="prerelease"
          if [[ "$BRANCH" =~ ^release-publish/v[0-9]+(\.[0-9]+){2}$ ]]; then
            TAG_NAME="${BRANCH#release-publish/}"
          elif [[ "$BRANCH" =~ ^release-publish-stable/v[0-9]+(\.[0-9]+){2}$ ]]; then
            TAG_NAME="${BRANCH#release-publish-stable/}"
            RELEASE_STATUS="release"
          else
            echo "Invalid explicit release branch: $BRANCH"
            exit 1
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_STATUS=$RELEASE_STATUS" >> "$GITHUB_ENV"

      - name: Dispatch validated package release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run package-windows-x64.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref now \
            -f tag_name="$TAG_NAME" \
            -f release_status="$RELEASE_STATUS"
          echo "Dispatched $RELEASE_STATUS for $TAG_NAME from now."
