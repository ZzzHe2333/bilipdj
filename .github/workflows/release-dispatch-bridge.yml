name: Explicit release dispatch bridge

on:
  push:
    branches:
      - 'release-publish/v*'

# This workflow is intentionally narrow: creating an explicit release-publish/v*
# branch is the opt-in action. Deleting/cleaning an old release-publish branch
# must never re-dispatch a historical release.
permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit release branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          if [[ ! "$BRANCH" =~ ^release-publish/v[0-9]+(\.[0-9]+){2,}(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid explicit release branch: $BRANCH"
            exit 1
          fi
          TAG_NAME="${BRANCH#release-publish/}"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Dispatch validated package release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run package-windows-x64.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref now \
            -f tag_name="$TAG_NAME"
          echo "Dispatched explicit release for $TAG_NAME from now."
