name: Tag v1.0.7 once

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/tag-v1.0.7-once.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0
      - name: Create clean release tag
        run: |
          TARGET_SHA='8a424c02da775713b517773a7b03a4fc14987827'
          git show "$TARGET_SHA:core/control_panel.py" | grep -q 'APP_VERSION = "1.0.7"'
          git show "$TARGET_SHA:RELEASE_NOTES.md" | grep -q '弹幕排队姬 v1.0.7'
          if git rev-parse -q --verify refs/tags/v1.0.7 >/dev/null; then
            echo 'v1.0.7 already exists'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.0.7 "$TARGET_SHA" -m '弹幕排队姬 v1.0.7'
          git push origin refs/tags/v1.0.7
      - name: Remove temporary tag workflow
        run: |
          git checkout now
          git pull --ff-only origin now
          git rm .github/workflows/tag-v1.0.7-once.yml
          git commit -m 'chore: remove v1.0.7 tag workflow'
          git push origin HEAD:now
