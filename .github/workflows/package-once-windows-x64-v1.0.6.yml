name: Package Windows x64 v1.0.6 once

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/package-once-windows-x64-v1.0.6.yml

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - name: Set internal version to 1.0.6
        id: version
        shell: pwsh
        run: |
          $path = "core/control_panel.py"
          $text = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          $matches = [regex]::Matches($text, 'APP_VERSION = "[^"]+"')
          if ($matches.Count -ne 1) {
            throw "Expected exactly one APP_VERSION assignment, found $($matches.Count)"
          }
          $updated = [regex]::Replace($text, 'APP_VERSION = "[^"]+"', 'APP_VERSION = "1.0.6"', 1)
          Set-Content -LiteralPath $path -Value $updated -Encoding UTF8 -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: bump version to 1.0.6"
            git push origin HEAD:now
          }
          $commitSha = (git rev-parse HEAD).Trim()
          "commit_sha=$commitSha" >> $env:GITHUB_OUTPUT

      - name: Verify source version
        shell: pwsh
        run: |
          python -c "from pathlib import Path; text=Path('core/control_panel.py').read_text(encoding='utf-8-sig'); assert 'APP_VERSION = \"1.0.6\"' in text"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows executable
        shell: pwsh
        run: |
          python scripts\scan_secrets.py
          python -m unittest discover -s tests -v
          .\scripts\package-amd64.ps1 -InstallDependencies

      - name: Create release zip
        shell: pwsh
        run: |
          if (Test-Path package) {
            Remove-Item -LiteralPath package -Recurse -Force
          }
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -Recurse "dist\bilipdj\*" package\
          if (Test-Path README.md)           { Copy-Item README.md           package\ }
          if (Test-Path core\quanxian.yaml)  { Copy-Item core\quanxian.yaml  package\ }
          if (Test-Path core\kaiguan.yaml)   { Copy-Item core\kaiguan.yaml   package\ }
          Compress-Archive -Path package\* -DestinationPath "bilibili-danmuji-windows-x64-v1.0.6.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-danmuji-windows-x64-v1.0.6
          path: bilibili-danmuji-windows-x64-v1.0.6.zip

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.6
          commit: ${{ steps.version.outputs.commit_sha }}
          name: v1.0.6
          artifacts: bilibili-danmuji-windows-x64-v1.0.6.zip
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true

      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --ff-only origin now
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/package-once-windows-x64-v1.0.6.yml
          git commit -m "chore: remove completed v1.0.6 packaging workflow"
          git push origin HEAD:now
