name: Dispatch v3.0.6 release once

on:
  push:
    branches:
      - now
    paths:
      - 'VERSION'
      - '.github/workflows/release-v3.0.6-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    if: github.repository == 'ZzzHe2333/bilipdj'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact release version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION" != "3.0.6" ]; then
            echo "One-shot release dispatcher only permits VERSION=3.0.6; got: $VERSION"
            exit 1
          fi

      - name: Dispatch existing explicit release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run package-windows-x64.yml \
            --repo ZzzHe2333/bilipdj \
            --ref now \
            -f tag_name=v3.0.6
          echo "Dispatched explicit v3.0.6 release workflow."
