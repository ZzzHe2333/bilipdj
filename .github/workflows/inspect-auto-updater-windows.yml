name: Inspect auto-updater Windows validation

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/inspect-auto-updater-windows.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0
      - name: Record validation status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 10
          gh api "repos/${{ github.repository }}/actions/workflows/validate-auto-updater-windows-once.yml/runs?per_page=1" > /tmp/runs.json
          RUN_ID=$(python -c "import json; print(json.load(open('/tmp/runs.json'))['workflow_runs'][0]['id'])")
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" > /tmp/jobs.json
          python - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json'))
          jobs=json.load(open('/tmp/jobs.json'))
          run=runs['workflow_runs'][0]
          out={'run':{k:run.get(k) for k in ('id','status','conclusion','html_url','head_sha')},'jobs':[{'id':j.get('id'),'name':j.get('name'),'status':j.get('status'),'conclusion':j.get('conclusion'),'steps':[{k:s.get(k) for k in ('name','status','conclusion','number')} for s in j.get('steps',[])]} for j in jobs.get('jobs',[])]}
          open('/tmp/auto-updater-windows-status.json','w').write(json.dumps(out,indent=2))
          PY
          git checkout --orphan diagnostic-auto-updater-windows
          git rm -rf .
          cp /tmp/auto-updater-windows-status.json .
          git add auto-updater-windows-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record auto-updater Windows validation"
          git push --force origin HEAD:diagnostic/auto-updater-windows
