name: Package portable Windows bundles

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '手动输入要发布的标签（示例：v3.0.0）'
        required: true
        type: string
  push:
    branches:
      - now
    tags:
      - 'v*'
    paths:
      - 'VERSION'
      - 'requirements.txt'
      - 'apps/server/**'
      - 'apps/windows/**'
      - 'apps/web/**'
      - 'scripts/build_incremental_update.py'
      - 'update-manifest.json'
      - 'core/RELEASE_NOTES.md'
      - '.github/workflows/package-windows-x64.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'requirements.txt'
      - 'apps/server/**'
      - 'apps/windows/**'
      - 'apps/web/**'
      - 'scripts/build_incremental_update.py'
      - 'update-manifest.json'
      - 'core/RELEASE_NOTES.md'
      - '.github/workflows/package-windows-x64.yml'

permissions:
  contents: read

jobs:
  build-portable-bundles:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.resolve_tag.outputs.version }}
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}
      tk_zip: ${{ steps.resolve_tag.outputs.tk_zip }}
      tk_files: ${{ steps.resolve_tag.outputs.tk_files }}
      tk_incremental: ${{ steps.resolve_tag.outputs.tk_incremental }}
      web_zip: ${{ steps.resolve_tag.outputs.web_zip }}
      artifact_name: ${{ steps.resolve_tag.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build/release name
        id: resolve_tag
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,}$ ]]; then
            echo "VERSION 文件格式不合法：$VERSION（应为 3.0.0 形式）"
            exit 1
          fi

          EXPLICIT_RELEASE=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG_NAME="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
            EXPLICIT_RELEASE=true
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            EXPLICIT_RELEASE=true
          else
            TAG_NAME="build-now-${GITHUB_SHA:0:8}"
          fi

          if [ "$EXPLICIT_RELEASE" = "true" ]; then
            if [[ ! "$TAG_NAME" =~ ^v[0-9A-Za-z._-]+$ ]]; then
              echo "发布标签格式不合法：$TAG_NAME（需以 v 开头，例如 v3.0.0）"
              exit 1
            fi
            if [ "$TAG_NAME" != "v$VERSION" ]; then
              echo "发布标签与 VERSION 不一致：标签=$TAG_NAME，VERSION=$VERSION"
              exit 1
            fi
          fi

          ARTIFACT_NAME="BiliPDJ-portable-bundles-$TAG_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "tk_zip=BiliPDJ-v$VERSION-Windows-Tk-Portable-x64.zip" >> "$GITHUB_OUTPUT"
          echo "tk_files=BiliPDJ-v$VERSION-Windows-Tk-files.json" >> "$GITHUB_OUTPUT"
          echo "tk_incremental=BiliPDJ-v$VERSION-Windows-Tk-Incremental-x64.pack" >> "$GITHUB_OUTPUT"
          echo "web_zip=BiliPDJ-v$VERSION-Web-Portable-x64.zip" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Tk Windows portable
        shell: pwsh
        run: |
          python scripts\scan_secrets.py
          .\apps\windows\package.ps1 -InstallDependencies

      - name: Build Web portable
        shell: pwsh
        run: |
          .\apps\web\package-portable.ps1

      - name: Validate portable outputs
        shell: pwsh
        run: |
          $required = @(
            "dist\bilipdj\main.exe",
            "dist\bilipdj\paiduijitm.exe",
            "dist\bilipdj\updater.exe",
            "dist\web-portable\bilipdj-web\BiliPDJ-Web.exe"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Portable output missing: $path" }
          }
          $tkConfig = Get-ChildItem "dist\bilipdj" -Recurse -Filter "config.html" | Select-Object -First 1
          $webConfig = Get-ChildItem "dist\web-portable\bilipdj-web" -Recurse -Filter "config.html" | Select-Object -First 1
          if (-not $tkConfig) { throw "Tk portable bundle does not contain Web assets" }
          if (-not $webConfig) { throw "Web portable bundle does not contain Web assets" }

          $tkExe = (Resolve-Path "dist\bilipdj\main.exe").Path
          $tkProbe = Start-Process -FilePath $tkExe -ArgumentList "--plugin-runtime-self-test" -Wait -PassThru
          if ($tkProbe.ExitCode -ne 0) { throw "Tk frozen JavaScript plugin self-test failed: $($tkProbe.ExitCode)" }

          $webExe = (Resolve-Path "dist\web-portable\bilipdj-web\BiliPDJ-Web.exe").Path
          $webProbe = Start-Process -FilePath $webExe -ArgumentList "--plugin-runtime-self-test" -Wait -PassThru
          if ($webProbe.ExitCode -ne 0) { throw "Web frozen JavaScript plugin self-test failed: $($webProbe.ExitCode)" }

      - name: Download previous Windows release baseline
        id: previous_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "previous-release" -Force | Out-Null
          try {
            $release = gh api repos/ZzzHe2333/bilipdj/releases/latest | ConvertFrom-Json
            $asset = $release.assets | Where-Object { $_.name -match '^BiliPDJ-v.+-Windows-Tk-Portable-x64\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw "latest release has no Windows Tk portable zip" }
            $tag = [string]$release.tag_name
            $baseVersion = if ($tag.StartsWith('v')) { $tag.Substring(1) } else { $tag }
            gh release download $tag --repo ZzzHe2333/bilipdj --pattern $asset.name --dir previous-release --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
            $previousZip = (Resolve-Path (Join-Path "previous-release" $asset.name)).Path
            "base_version=$baseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "previous_zip=$previousZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Incremental baseline: $tag / $previousZip"
          }
          catch {
            Write-Warning "Previous release baseline unavailable; range pack still contains all managed target files: $_"
            "base_version=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "previous_zip=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Create portable zips, checksums and update manifest
        shell: pwsh
        run: |
          foreach ($path in @("package-tk", "package-web")) {
            if (Test-Path $path) { Remove-Item -LiteralPath $path -Recurse -Force }
            New-Item -ItemType Directory -Path $path -Force | Out-Null
          }

          Copy-Item -Recurse "dist\bilipdj\*" "package-tk\"
          Copy-Item -Recurse "dist\web-portable\bilipdj-web\*" "package-web\"
          foreach ($file in @("VERSION", "README.md")) {
            if (Test-Path $file) {
              Copy-Item $file "package-tk\" -Force
              Copy-Item $file "package-web\" -Force
            }
          }
          if (Test-Path "core\RELEASE_NOTES.md") {
            Copy-Item "core\RELEASE_NOTES.md" "package-tk\RELEASE_NOTES.md" -Force
            Copy-Item "core\RELEASE_NOTES.md" "package-web\RELEASE_NOTES.md" -Force
          }

          @"
          BiliPDJ v${{ steps.resolve_tag.outputs.version }} Windows Tk 便携版

          1. 请完整解压 ZIP，不要只拖出 main.exe。
          2. 双击 main.exe 启动桌面前端。
          3. 后端服务器必须保持运行；后端停止后，排队、弹幕和管理功能均不可用。
          4. 全量更新继续下载完整 ZIP；增量更新按逐文件 SHA-256 扫描，并从同一 Release 的资源包中只读取缺失或变化的文件片段。
          "@ | Set-Content -LiteralPath "package-tk\使用说明.txt" -Encoding utf8

          @"
          BiliPDJ v${{ steps.resolve_tag.outputs.version }} Web 便携版

          1. 请完整解压 ZIP，不要只拖出 BiliPDJ-Web.exe。
          2. 双击 BiliPDJ-Web.exe 启动“后端服务器系统”。
          3. 后端运行后会自动打开浏览器管理页；可隐藏到系统托盘继续运行。
          4. 关闭后端服务器后，Web 控制台、队列和第三方客户端均无法继续使用核心功能。
          5. 更新程序会先读取 update-manifest.json，再按清单提供准确的包名、下载地址和 SHA-256。
          "@ | Set-Content -LiteralPath "package-web\使用说明.txt" -Encoding utf8

          $tkZip = "${{ steps.resolve_tag.outputs.tk_zip }}"
          $tkFiles = "${{ steps.resolve_tag.outputs.tk_files }}"
          $tkIncremental = "${{ steps.resolve_tag.outputs.tk_incremental }}"
          $webZip = "${{ steps.resolve_tag.outputs.web_zip }}"
          Compress-Archive -Path "package-tk\*" -DestinationPath $tkZip -Force
          Compress-Archive -Path "package-web\*" -DestinationPath $webZip -Force

          $tkHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tkZip).Hash.ToLowerInvariant()
          $webHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $webZip).Hash.ToLowerInvariant()
          "$tkHash  $tkZip" | Set-Content -LiteralPath "$tkZip.sha256" -Encoding ascii
          "$webHash  $webZip" | Set-Content -LiteralPath "$webZip.sha256" -Encoding ascii

          $version = "${{ steps.resolve_tag.outputs.version }}"
          $baseVersion = "${{ steps.previous_release.outputs.base_version }}"
          $previousZip = "${{ steps.previous_release.outputs.previous_zip }}"
          $buildArgs = @(
            "scripts\build_incremental_update.py",
            "--package-dir", "package-tk",
            "--version", $version,
            "--package-sha256", $tkHash,
            "--output-manifest", $tkFiles,
            "--output-pack", $tkIncremental,
            "--base-version", $baseVersion
          )
          if ($previousZip -and (Test-Path -LiteralPath $previousZip)) {
            $buildArgs += @("--previous-zip", $previousZip)
          }
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "incremental update metadata build failed" }

          $tkFilesHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tkFiles).Hash.ToLowerInvariant()
          $tkIncrementalHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $tkIncremental).Hash.ToLowerInvariant()
          "$tkFilesHash  $tkFiles" | Set-Content -LiteralPath "$tkFiles.sha256" -Encoding ascii
          "$tkIncrementalHash  $tkIncremental" | Set-Content -LiteralPath "$tkIncremental.sha256" -Encoding ascii

          $tagName = "${{ steps.resolve_tag.outputs.tag_name }}"
          $releaseBase = "https://github.com/ZzzHe2333/bilipdj/releases/download/$tagName"
          $releasePage = "https://github.com/ZzzHe2333/bilipdj/releases/tag/$tagName"
          $manifest = [ordered]@{
            schema = 2
            version = $version
            tag_name = $tagName
            name = "弹幕排队姬 $tagName"
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_url = $releasePage
            notes = "完整更新说明请查看 Release 页面。Windows 客户端可选择全量更新，或依据逐文件 SHA-256 从增量资源包按 Range 读取实际需要的文件。"
            packages = [ordered]@{
              "windows-tk-x64" = [ordered]@{
                filename = $tkZip
                url = "$releaseBase/$tkZip"
                sha256 = $tkHash
                size = (Get-Item -LiteralPath $tkZip).Length
                file_manifest = [ordered]@{
                  filename = $tkFiles
                  url = "$releaseBase/$tkFiles"
                  sha256 = $tkFilesHash
                  size = (Get-Item -LiteralPath $tkFiles).Length
                }
                incremental = [ordered]@{
                  filename = $tkIncremental
                  url = "$releaseBase/$tkIncremental"
                  sha256 = $tkIncrementalHash
                  size = (Get-Item -LiteralPath $tkIncremental).Length
                  base_version = $baseVersion
                  transport = "http-range"
                }
              }
              "web-portable-x64" = [ordered]@{
                filename = $webZip
                url = "$releaseBase/$webZip"
                sha256 = $webHash
                size = (Get-Item -LiteralPath $webZip).Length
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath "update-manifest.json" -Encoding utf8

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve_tag.outputs.artifact_name }}
          path: |
            ${{ steps.resolve_tag.outputs.tk_zip }}
            ${{ steps.resolve_tag.outputs.tk_zip }}.sha256
            ${{ steps.resolve_tag.outputs.tk_files }}
            ${{ steps.resolve_tag.outputs.tk_files }}.sha256
            ${{ steps.resolve_tag.outputs.tk_incremental }}
            ${{ steps.resolve_tag.outputs.tk_incremental }}.sha256
            ${{ steps.resolve_tag.outputs.web_zip }}
            ${{ steps.resolve_tag.outputs.web_zip }}.sha256
            update-manifest.json

  release-portable-bundles:
    name: Publish explicit GitHub Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build-portable-bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download validated portable artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-portable-bundles.outputs.artifact_name }}
          path: release-assets

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build-portable-bundles.outputs.tag_name }}
          commit: ${{ github.sha }}
          name: 弹幕排队姬 ${{ needs.build-portable-bundles.outputs.tag_name }}
          artifacts: release-assets/${{ needs.build-portable-bundles.outputs.tk_zip }},release-assets/${{ needs.build-portable-bundles.outputs.tk_zip }}.sha256,release-assets/${{ needs.build-portable-bundles.outputs.tk_files }},release-assets/${{ needs.build-portable-bundles.outputs.tk_files }}.sha256,release-assets/${{ needs.build-portable-bundles.outputs.tk_incremental }},release-assets/${{ needs.build-portable-bundles.outputs.tk_incremental }}.sha256,release-assets/${{ needs.build-portable-bundles.outputs.web_zip }},release-assets/${{ needs.build-portable-bundles.outputs.web_zip }}.sha256,release-assets/update-manifest.json
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: core/RELEASE_NOTES.md
          generateReleaseNotes: false
