name: Issue 262 one-shot refactor

on:
  push:
    branches:
      - fix/issue-262-six-bugs-scripts-decouple

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-262-six-bugs-scripts-decouple
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply refactor
        run: python .github/issue262_refactor.py
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: 修复六项回归并解耦 scripts 测试代码 [issue262-refactor-done]"
          git push origin HEAD:fix/issue-262-six-bugs-scripts-decouple
