name: Finalize v1.0.8 once

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/finalize-v1.0.8-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and validate release
        run: |
          python scripts/prepare_v1_0_8.txt
          rm scripts/prepare_v1_0_8.txt
          python -m pip install -r requirements.txt
          python -m compileall -q core tests
          python -m unittest discover -s tests -v
          python scripts/scan_secrets.py
          git diff --check
          grep -q 'APP_VERSION = "1.0.8"' core/control_panel.py
      - name: Commit release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/control_panel.py UPDATE.md RELEASE_NOTES.md
          git add -u scripts/prepare_v1_0_8.txt
          git commit -m "release: prepare v1.0.8"
          git push origin HEAD:release/v1.0.8

# Trigger after workflow registration.
