name: Trigger v1.0.7 inspection second pass

on:
  push:
    branches:
      - release/v1.0.7
    paths:
      - .github/workflows/release-v1.0.7-trigger-2.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.7
          fetch-depth: 0
      - name: Inspect release inputs
        shell: bash
        run: |
          find . -type f -not -path './.git/*' | sort > repo-files.txt
          git grep -n -E 'APP_VERSION|1\.0\.6|PyInstaller|gh release|package-windows' > repo-inspection.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f repo-files.txt repo-inspection.txt
          git commit -m 'chore: inspect v1.0.7 release inputs'
          git push origin HEAD:release/v1.0.7
