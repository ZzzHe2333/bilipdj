name: Sensitive content scan
run-name: Sensitive content scan

on:
  schedule:
    # GitHub cron cannot express a rolling 72-hour interval across month boundaries.
    # Wake up daily and use the persisted state below to run the real scan at most
    # once every 72 hours.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sensitive-content-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Restore previous scan state
        id: restore-state
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .secret-scan-state
          key: secret-scan-state-${{ github.run_id }}
          restore-keys: |
            secret-scan-state-

      - name: Decide whether a scan is needed
        id: gate
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          output_path = Path(os.environ["GITHUB_OUTPUT"])

          def emit(name: str, value: object) -> None:
              with output_path.open("a", encoding="utf-8") as handle:
                  handle.write(f"{name}={value}\n")

          if not Path(".git").is_dir():
              emit("should_scan", "false")
              emit("reason", "checkout_failed")
              raise SystemExit(0)

          now = int(time.time())
          head_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          latest_commit_at = int(
              subprocess.check_output(
                  ["git", "log", "-1", "--format=%ct"], text=True
              ).strip()
          )

          state_path = Path(".secret-scan-state/state.json")
          state: dict[str, object] = {}
          try:
              if state_path.is_file():
                  state = json.loads(state_path.read_text(encoding="utf-8"))
          except (OSError, ValueError, TypeError):
              state = {}

          try:
              last_scan_at = int(state.get("scanned_at", 0) or 0)
          except (TypeError, ValueError):
              last_scan_at = 0

          last_scan_age = now - last_scan_at if last_scan_at else None
          scanned_same_head = str(state.get("head_sha", "")) == head_sha
          scanned_within_72h = (
              last_scan_age is not None and last_scan_age < 72 * 60 * 60
          )
          scanned_within_5d = (
              last_scan_age is not None and last_scan_age < 5 * 24 * 60 * 60
          )
          no_commit_for_5d = now - latest_commit_at >= 5 * 24 * 60 * 60
          manual = os.environ.get("EVENT_NAME") == "workflow_dispatch"

          if manual:
              should_scan = True
              reason = "manual_request"
          elif scanned_within_72h:
              should_scan = False
              reason = "scanned_within_72_hours"
          elif no_commit_for_5d and scanned_same_head and scanned_within_5d:
              should_scan = False
              reason = "inactive_repository_and_recently_scanned"
          else:
              should_scan = True
              reason = "scheduled_scan_due"

          emit("should_scan", str(should_scan).lower())
          emit("reason", reason)
          emit("head_sha", head_sha)
          emit("cache_key", f"secret-scan-state-{os.environ['RUN_ID']}")
          PY

      - name: Scan tracked files for sensitive content
        id: secret-scan
        if: steps.gate.outputs.should_scan == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/scan_secrets.py 2>&1 | tee secret-scan.log
          scan_exit=${PIPESTATUS[0]}
          set -e

          if grep -Fq "Potential secrets detected in tracked files:" secret-scan.log; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "completed=true" >> "$GITHUB_OUTPUT"
          elif [ "$scan_exit" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "completed=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "completed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sensitive-content scanner could not complete (exit $scan_exit). The workflow is configured not to fail on scanner or infrastructure errors."
          fi

      - name: Record completed scan
        if: steps.gate.outputs.should_scan == 'true' && steps.secret-scan.outputs.completed == 'true'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        shell: bash
        run: |
          mkdir -p .secret-scan-state
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          Path(".secret-scan-state/state.json").write_text(
              json.dumps(
                  {
                      "scanned_at": int(time.time()),
                      "head_sha": os.environ.get("HEAD_SHA", ""),
                  },
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY

      - name: Save scan state
        if: steps.gate.outputs.should_scan == 'true' && steps.secret-scan.outputs.completed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .secret-scan-state
          key: ${{ steps.gate.outputs.cache_key }}

      - name: Write scan summary
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SHOULD_SCAN: ${{ steps.gate.outputs.should_scan }}
          REASON: ${{ steps.gate.outputs.reason }}
          FOUND: ${{ steps.secret-scan.outputs.found }}
          COMPLETED: ${{ steps.secret-scan.outputs.completed }}
        run: |
          {
            echo "## Sensitive content scan"
            echo
            echo "- Decision: ${SHOULD_SCAN:-false}"
            echo "- Reason: ${REASON:-workflow_step_error}"
            echo "- Completed: ${COMPLETED:-false}"
            echo "- Sensitive content found: ${FOUND:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail only when sensitive content is confirmed
        if: steps.secret-scan.outputs.found == 'true'
        shell: bash
        run: |
          echo "::error::Confirmed sensitive content was found. Review the 'Scan tracked files for sensitive content' step and remove or rotate the affected credentials."
          exit 1
