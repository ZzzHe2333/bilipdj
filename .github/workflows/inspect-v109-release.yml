name: Inspect v1.0.9 release

on:
  push:
    branches: [now]
    paths:
      - .github/workflows/inspect-v109-release.yml

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now
          fetch-depth: 0

      - name: Record release and workflow status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.9" > /tmp/release.json 2>/tmp/release-error.txt || true
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          release_path = Path('/tmp/release.json')
          release = None
          if release_path.exists() and release_path.stat().st_size:
              try:
                  release = json.loads(release_path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  release = None

          runs_payload = json.loads(Path('/tmp/runs.json').read_text(encoding='utf-8'))
          names = {
              'Release v1.0.9 once',
              'Package Windows x64',
              'Package macOS',
              'Quality and API compatibility',
          }
          runs = []
          for run in runs_payload.get('workflow_runs', []):
              if run.get('name') not in names:
                  continue
              runs.append({key: run.get(key) for key in (
                  'id', 'name', 'event', 'status', 'conclusion', 'head_branch',
                  'head_sha', 'created_at', 'updated_at', 'html_url'
              )})

          output = {
              'release': None if release is None else {
                  key: release.get(key) for key in (
                      'id', 'tag_name', 'name', 'draft', 'prerelease',
                      'published_at', 'html_url', 'target_commitish'
                  )
              },
              'assets': [] if release is None else [
                  {key: asset.get(key) for key in (
                      'id', 'name', 'size', 'state', 'download_count',
                      'created_at', 'updated_at', 'browser_download_url'
                  )}
                  for asset in release.get('assets', [])
              ],
              'runs': runs,
              'release_error': Path('/tmp/release-error.txt').read_text(encoding='utf-8', errors='replace') if Path('/tmp/release-error.txt').exists() else '',
          }
          Path('/tmp/v1.0.9-release-status.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          PY

          git checkout --orphan diagnostic-v109-release
          git rm -rf .
          cp /tmp/v1.0.9-release-status.json .
          git add v1.0.9-release-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record v1.0.9 release status"
          git push --force origin HEAD:diagnostic/v1.0.9-release

