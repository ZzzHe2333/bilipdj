name: Apply LAN listen toggle v3

on:
  pull_request:
    branches: [now]
    paths:
      - .github/workflows/apply-lan-listen-toggle-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          workflow = Path('.github/workflows/apply-lan-listen-toggle.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python - <<'PY' 2>&1 \| tee lan-toggle-apply\.log\n(.*?)^          PY$", workflow)
          if match is None:
              raise RuntimeError('unable to extract LAN patch script')
          exec(compile(textwrap.dedent(match.group(1)), 'apply_lan_listen_toggle.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate
        run: |
          python -m compileall -q core
          python - <<'PY'
          from pathlib import Path
          from core import server

          assert server.normalize_server_config({}) == {"host": "127.0.0.1", "port": 9816, "lan_listen": False}
          assert server.normalize_server_config({"lan_listen": True}) == {"host": "0.0.0.0", "port": 9816, "lan_listen": True}
          assert server.normalize_server_config({"host": "0.0.0.0"})["lan_listen"] is True
          assert server.normalize_server_config({"host": "::"})["host"] == "0.0.0.0"
          assert server.normalize_server_config({"host": "0.0.0.0", "lan_listen": False})["host"] == "127.0.0.1"
          panel = Path('core/control_panel.py').read_text(encoding='utf-8')
          assert "允许局域网访问" in panel
          assert '"lan_listen": bool(self.lan_listen_var.get())' in panel
          assert 'entry.configure(state="readonly")' in panel
          PY
          git diff --check
      - name: Commit clean feature
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch \
            .github/workflows/apply-lan-listen-toggle.yml \
            .github/workflows/apply-lan-listen-toggle-v2.yml \
            .github/workflows/apply-lan-listen-toggle-v3.yml \
            lan-toggle-apply.log \
            lan-toggle-validation.log
          git add core/server.py core/control_panel.py
          git commit -m "feat: add optional LAN listening"
          git push origin "HEAD:${HEAD_BRANCH}"
