name: Validate Plugin HTTP Host API

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/server/javascript_plugin_runtime.py'
      - 'apps/server/plugin_http_request.py'
      - 'scripts/issue140_http_request_guard.py'
      - 'docs/PLUGIN_HTTP_REQUEST.md'
      - '.github/workflows/plugin-http-request.yml'
      - 'requirements.txt'
  push:
    branches: [now]
    paths:
      - 'apps/server/javascript_plugin_runtime.py'
      - 'apps/server/plugin_http_request.py'
      - 'scripts/issue140_http_request_guard.py'
      - 'docs/PLUGIN_HTTP_REQUEST.md'
      - '.github/workflows/plugin-http-request.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  validate-plugin-http-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Issue 140 sources
        run: python -m py_compile apps/server/plugin_http_request.py apps/server/javascript_plugin_runtime.py scripts/issue140_http_request_guard.py
      - name: Run Issue 140 HTTP Host regression guard
        run: python scripts/issue140_http_request_guard.py
      - name: Run existing QuickJS runtime probe
        run: python scripts/issue130_js_runtime_probe.py
