name: Apply Issue 144 3.0.0 release metadata

on:
  push:
    branches: [release/3.0.0]
    paths:
      - 'scripts/issue144_release_prep.py'
      - '.github/workflows/issue144-release-prep.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/3.0.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact release metadata patch
        run: python scripts/issue144_release_prep.py
      - name: Validate release metadata
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "3.0.0"
          grep -q 'BiliPDJ-v3.0.0-Windows-Tk-Portable-x64.zip' README.md
          grep -q 'BiliPDJ-v3.0.0-Web-Portable-x64.zip' README.md
          grep -q '# 弹幕排队姬 v3.0.0' core/RELEASE_NOTES.md
          grep -q '## v3.0.0（2026-09-11）' core/UPDATE.md
          grep -q '"version": "3.0.0"' packages/shared/api-contract.md
          grep -q '3.0.0' core/ai.md
          python scripts/scan_secrets.py
          git diff --check
      - name: Commit validated release metadata and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/issue144_release_prep.py .github/workflows/issue144-release-prep.yml
          git add VERSION README.md core/ai.md core/RELEASE_NOTES.md core/UPDATE.md packages/shared/api-contract.md
          git diff --cached --check
          git commit -m "release: prepare BiliPDJ 3.0.0 metadata (#144)"
          git push origin HEAD:release/3.0.0
